<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generátor — BIOLOGIE — 1. ročník</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#3b82f6,#6366f1);padding:24px;min-height:100vh}
    .container{max-width:820px;margin:0 auto}
    .card{background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:32px;margin-bottom:24px}
    h1{font-size:24px;font-weight:700;color:#1f2937;margin-bottom:20px;text-align:center}
    h2{font-size:15px;font-weight:600;color:#374151;margin-bottom:10px}
    .info{background:#eff6ff;border-radius:8px;padding:13px 16px;margin-bottom:18px;font-size:13px;color:#374151;line-height:1.6}
    .fg{margin-bottom:13px}
    .fg label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
    input,select{width:100%;padding:9px 12px;border:2px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;background:white}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .msw{display:flex;border:2px solid #d1d5db;border-radius:10px;overflow:hidden;margin-bottom:14px}
    .mb{flex:1;padding:11px;background:white;border:none;cursor:pointer;font-size:14px;font-weight:500;color:#6b7280}
    .mb.active{background:linear-gradient(to right,#3b82f6,#6366f1);color:white}
    .mi{background:#f9fafb;border:2px solid #e5e7eb;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#374151}
    .cbox{border:2px solid #e5e7eb;border-radius:12px;padding:15px;margin-bottom:18px}
    .chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:8px}
    .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px}
    .ci{border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 10px}
    .ci:has(.cc:checked){border-color:#3b82f6;background:#eff6ff}
    .cl{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
    .cl input{width:14px;height:14px;accent-color:#3b82f6;flex-shrink:0}
    .cn{flex:1;color:#374151;font-weight:500}
    .cb{background:#e5e7eb;color:#6b7280;font-size:11px;padding:1px 7px;border-radius:20px}
    .ci:has(.cc:checked) .cb{background:#3b82f6;color:white}
    .cbtn{padding:5px 11px;border-radius:6px;border:1.5px solid #d1d5db;background:white;cursor:pointer;font-size:12px;font-weight:600;color:#374151}
    .btn{padding:13px;border-radius:8px;font-weight:600;border:none;cursor:pointer;font-size:15px;width:100%;margin-top:7px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
    .bp{background:linear-gradient(to right,#3b82f6,#6366f1);color:white}
    .bo{background:linear-gradient(to right,#10b981,#059669);color:white}
    .bs{background:linear-gradient(to right,#6b7280,#4b5563);color:white;margin-top:13px}
    .warn{background:#fef3c7;border:2px solid #fbbf24;border-radius:8px;padding:11px;margin-top:12px;display:none;text-align:center;font-size:13px;color:#92400e}
    .ok{background:#d1fae5;border:2px solid #10b981;border-radius:8px;padding:13px;margin:12px 0;display:none;font-size:13px;color:#065f46}
    .tip{background:#dbeafe;border-radius:8px;padding:13px;margin-top:18px;font-size:13px;color:#1e40af;line-height:1.5}
  </style>
</head>
<body>

          <input type="checkbox" class="cc" value="Řasy" checked>
          <span class="cn">Řasy</span><span class="cb">5 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Mechorosty" checked>
          <span class="cn">Mechorosty</span><span class="cb">5 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Kapraďorosty" checked>
          <span class="cn">Kapraďorosty</span><span class="cb">5 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Nahosemenné rostliny" checked>
          <span class="cn">Nahosemenné rostliny</span><span class="cb">5 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Krytosemenné rostliny" checked>

        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Kořen, stonek, list" checked>

        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Květ, opylení, oplození" checked>
          <span class="cn">Květ, opylení, oplození</span><span class="cb">10 ot.</span>

          <input type="checkbox" class="cc" value="Významné čeledi rostlin" checked>
          <span class="cn">Významné čeledi rostlin</span><span class="cb">10 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Ekologie" checked>
          <span class="cn">Ekologie</span><span class="cb">10 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Viry" checked>
          <span class="cn">Viry</span><span class="cb">10 ot.</span>
        </label></div></div>
  </div>

  <div id="aP"><button class="btn bp" onclick="genPrint()">📄 Vygenerovat testy k tisku</button></div>
  <div id="aO" style="display:none"><button class="btn bo" onclick="genOnline()">💻 Vygenerovat online test</button></div>

<script>
  const questionsDatabase = {"Geologie a mineralogie": [{"q": "Co je geologie?", "a": "Věda, která studuje složení, stavbu, historii a vývoj Země."}, {"q": "Jaké jsou hlavní typy hornin?", "a": "Magmatické, usazené (sedimentární) a přeměněné (metamorfované)"}, {"q": "Jak se nazývá proces, při kterém se hornina mění vlivem tlaku a teploty?", "a": "Metamorfóza"}, {"q": "Co je to minerál?", "a": "Přírodně se vyskytující anorganická látka s určitou chemickou skladbou a krystalovou strukturou"}, {"q": "Které dva základní typy zemské kůry rozlišujeme?", "a": "Oceánskou a pevninskou"}, {"q": "Jak vznikají usazené horniny?", "a": "Hromaděním a zpevňováním úlomků jiných hornin, usazováním organických zbytků nebo chemickým vysrážením z roztoků"}, {"q": "Jaký je rozdíl mezi vnitřními a vnějšími geologickými procesy?", "a": "Vnitřní procesy (magmatismus, vrásnění, zemětřesení) jsou poháněny energií z nitra Země. Vnější procesy (eroze, zvětrávání) jsou poháněny energií Slunce a gravitace"}, {"q": "Jak vznikají sopečné horniny?", "a": "Utuhnutím magmatu, které vyvřelo na povrch – například čedič nebo ryolit"}, {"q": "Co je to fosilie a jaký je její význam?", "a": "Zachovalý zbytek nebo stopa organismu v horninách. Slouží k určování stáří hornin a podmínek prostředí v minulosti"}, {"q": "Jaké jsou hlavní části Země podle vnitřní stavby?", "a": "Zemská kůra, zemský plášť, zemské jádro"}, {"q": "Jak se liší zemská kůra oceánská od pevninské?", "a": "Oceánská: tenčí (5–15 km), hustší, složená hlavně z čedičů. Pevninská: silnější (30–70 km), lehčí, složená převážně ze žuly a sedimentů"}, {"q": "Co je to litosféra?", "a": "Vnější pevná vrstva Země zahrnující zemskou kůru a svrchní část pláště; je rozlámaná na litosférické desky"}, {"q": "Jaký je rozdíl mezi minerálem a horninou?", "a": "Minerál je základní stavební jednotka, zatímco hornina je soubor jednoho nebo více minerálů"}, {"q": "Jaká jsou základní kritéria pro rozpoznání minerálů?", "a": "Tvrdost, barva, lesk, štěpnost/lom, hustota, krystalový tvar a chemické složení"}, {"q": "Jaké známe základní krystalové soustavy?", "a": "Krychlová, tetragonální, hexagonální, trigonální, ortorombická, monoklinická a triklinická"}, {"q": "Co vyjadřuje Mohsova stupnice?", "a": "Relativní tvrdost minerálů od 1 (mastek) po 10 (diamant)"}, {"q": "Jaké hlavní třídy minerálů podle chemismu známe?", "a": "Prvky, sulfidy, oxidy a hydroxidy, halogenidy, karbonáty, fosfáty, silikáty"}, {"q": "Která skupina minerálů je nejrozšířenější v zemské kůře?", "a": "Silikáty (např. křemen, živce, slídy, olivín)"}, {"q": "Který minerál je hlavní rudou železa?", "a": "Hematit (Fe₂O₃) a magnetit (Fe₃O₄)"}, {"q": "Jaký minerál je hlavním zdrojem hliníku?", "a": "Bauxit (směs hydrátů Al-oxidu)"}, {"q": "Který minerál je nejtvrdší a který nejměkčí?", "a": "Nejtvrdší – diamant (10), nejměkčí – mastek (1) na Mohsově stupnici"}, {"q": "Co je petrologie a jaký je její hlavní cíl?", "a": "Věda zabývající se studiem hornin – jejich složením, původem, strukturou a podmínkami vzniku"}, {"q": "Na jaké tři hlavní skupiny se horniny dělí?", "a": "Magmatické, sedimentární a metamorfované"}, {"q": "Jak vznikají magmatické horniny?", "a": "Krystalizací magmatu či lávy – buď pod povrchem (intruzivní), nebo na povrchu (efuzivní)"}, {"q": "Jaký je rozdíl mezi žulou (granit) a čedičem (basalt)?", "a": "Žula: světlá, kyselá, hrubozrnná intruzivní hornina. Čedič: tmavá, jemnozrnná, bazická efuzivní hornina"}, {"q": "Co znamená pojem 'metamorfóza' hornin?", "a": "Přeměna hornin za zvýšeného tlaku a/nebo teploty, při níž se mění minerální složení a struktura bez roztavení"}], "Buněčné dýchání a fotosyntéza": [{"q": "Co je buněčné dýchání a jaký je jeho hlavní význam?", "a": "Proces, při kterém buňky získávají energii z organických látek (zejména glukózy). Hlavním produktem je ATP"}, {"q": "Jaká je obecná rovnice buněčného dýchání?", "a": "C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energie (ATP)"}, {"q": "Jaké fáze buněčného dýchání rozlišujeme?", "a": "Glykolýza (cytoplazma), Krebsův cyklus (matrix mitochondrie), dýchací řetězec (vnitřní membrána mitochondrie)"}, {"q": "Jaký je rozdíl mezi aerobním a anaerobním dýcháním?", "a": "Aerobní: za přítomnosti kyslíku, vzniká až 38 ATP. Anaerobní: bez kyslíku, vzniká kyselina mléčná nebo ethanol, jen 2 ATP"}, {"q": "Proč jsou mitochondrie nazývány 'elektrárnami buňky'?", "a": "Protože v nich probíhá Krebsův cyklus a dýchací řetězec, kde vzniká většina ATP"}, {"q": "Co je fotosyntéza a proč je důležitá?", "a": "Proces, při kterém chlorofyl zachycuje světelnou energii a přeměňuje ji na chemickou. Vzniká glukóza a kyslík"}, {"q": "Jaká je obecná rovnice fotosyntézy?", "a": "6 CO₂ + 6 H₂O + světelná energie → C₆H₁₂O₆ + 6 O₂"}, {"q": "Kde probíhá fotosyntéza?", "a": "V chloroplastech – světelná fáze v thylakoidech, temnostní (Calvinův cyklus) ve stromatu"}, {"q": "Jaké dvě hlavní fáze fotosyntézy rozlišujeme?", "a": "Světelnou (v thylakoidech) a temnostní – Calvinův cyklus (ve stromatu)"}, {"q": "Jaký je význam chlorofylu?", "a": "Fotosyntetický pigment zachycující světelnou energii a umožňující její přeměnu na chemickou energii"}], "DNA, RNA a syntéza bílkovin": [{"q": "Co je transkripce a kde probíhá?", "a": "Přepis genetické informace z DNA do mRNA; probíhá v jádře buňky"}, {"q": "Co je translace a kde probíhá?", "a": "Překlad informace z mRNA do sekvence aminokyselin (bílkoviny); probíhá na ribozomech v cytoplazmě"}, {"q": "Jakou úlohu má tRNA?", "a": "Přenáší specifické aminokyseliny na ribozom a svým antikodonem páruje s kodonem mRNA"}], "Prokaryotické buňky": [{"q": "Co je prokaryotická buňka?", "a": "Jednoduchý typ buňky bez pravého membránového jádra; DNA je volně v oblasti nazvané nukleoid"}, {"q": "Jaké organismy patří mezi prokaryota?", "a": "Bakterie a archea"}, {"q": "Jaké struktury obsahuje prokaryotická buňka?", "a": "Buněčná stěna, cytoplazmatická membrána, cytoplazma, ribozomy, nukleoid, plazmidy; někdy bičík nebo kapsula"}, {"q": "Jak probíhá rozmnožování prokaryot?", "a": "Především binárním dělením (nepohlavně); genetická výměna možná konjugací, transdukce nebo transformací"}, {"q": "Jakou funkci mají plazmidy?", "a": "Malé kruhové molekuly DNA nesoucí doplňkové geny (např. rezistence na antibiotika); mohou se přenášet mezi buňkami"}], "Eukaryotické buňky": [{"q": "Co je eukaryotická buňka?", "a": "Složitý typ buňky s pravým jádrem ohraničeným jadernou membránou a membránovými organelami"}, {"q": "Které organismy mají eukaryotické buňky?", "a": "Rostliny, živočichové, houby a prvoci"}, {"q": "Jaké organely obsahuje eukaryotická buňka?", "a": "Jádro, mitochondrie, ER (hladké i drsné), Golgiho aparát, lyzozomy, ribozomy; rostlinné buňky navíc chloroplasty, vakuoly a buněčnou stěnu"}, {"q": "Jaká je funkce mitochondrií?", "a": "Probíhá v nich aerobní buněčné dýchání (Krebsův cyklus + dýchací řetězec) a vzniká ATP – jsou to 'elektrárny buňky'"}], "Rostlinná buňka a pletiva": [{"q": "Co je základní jednotkou rostlinného těla?", "a": "Rostlinná buňka"}, {"q": "Který organel umožňuje fotosyntézu?", "a": "Chloroplast"}, {"q": "Co chrání rostlinnou buňku a dává jí pevnost?", "a": "Buněčná stěna (tvořená celulózou)"}, {"q": "Kde je uložena genetická informace v rostlinné buňce?", "a": "Především v jádře (chromozomy), dále v mitochondriích a chloroplastech"}, {"q": "Kde se ukládá voda, živiny a odpadní látky v rostlinné buňce?", "a": "Ve vakuole"}, {"q": "Co jsou rostlinná pletiva?", "a": "Soubory buněk stejného tvaru, původu a funkce, tvořící různé části rostlinného těla"}, {"q": "Jaké jsou hlavní typy pletiv podle funkce?", "a": "Dělivá (meristémy), krycí (epidermis, periderm), vodivá (xylém, floém), základní (parenchym, kolenchym, sklerenchym)"}, {"q": "Co je meristém?", "a": "Pletivo tvořené aktivně se dělícími buňkami; zajišťuje růst rostliny"}, {"q": "Kde se nachází vrcholový meristém?", "a": "Na špičkách kořenů a stonků; zajišťuje růst do délky (primární růst)"}, {"q": "Jaká je funkce krycího pletiva?", "a": "Chrání rostlinu před ztrátou vody, mechanickým poškozením a patogeny"}, {"q": "Co tvoří vodivá pletiva?", "a": "Xylém (vede vodu a minerály od kořenů) a floém (vede produkty fotosyntézy)"}], "Bakterie a sinice": [{"q": "Co jsou bakterie?", "a": "Jednobuněčné prokaryotické organismy bez pravého jádra s buněčnou stěnou; nejrozmanitější skupina živých organismů"}, {"q": "Jaké jsou hlavní tvary bakterií?", "a": "Koky (kulovité), bacily (tyčinkové), spirily (spirálovité), vibria (zahnuté tyčinky)"}, {"q": "Jak se bakterie rozmnožují?", "a": "Binárním dělením (nepohlavně); za příznivých podmínek velmi rychle. Některé tvoří endospory při nepříznivých podmínkách"}, {"q": "Jaký je význam bakterií pro člověka a přírodu?", "a": "Rozkládají organické látky (tvorba humusu), fixují vzdušný dusík, jsou součástí střevní mikroflóry; některé jsou patogenní"}, {"q": "Co jsou sinice?", "a": "Prokaryotické fotosyntetizující organismy (grampozitivní bakterie) s chlorofylem; dříve zvané modrozelené řasy"}, {"q": "Jak se liší sinice od ostatních bakterií?", "a": "Obsahují chlorofyl a provádějí oxygenovoufo fotosyntézu; jsou schopny produkovat kyslík"}, {"q": "Jaký je význam sinic v přírodě?", "a": "Producenti kyslíku a organické hmoty; základ potravních řetězců ve vodních ekosystémech; některé fixují vzdušný dusík"}, {"q": "Jak se sinice rozmnožují?", "a": "Nepohlavně – přímým dělením buněk, fragmentací vlákna nebo tvorbou spor (akinet)"}, {"q": "Kde sinice žijí?", "a": "Ve sladkovodních i mořských vodách, v půdě, na vlhkých skalách; některé tvoří symbiózu s houbami (lišejníky)"}], "Řasy": [{"q": "Co jsou řasy?", "a": "Fotosyntetizující organismy žijící převážně ve vodě; mohou být jednobuněčné, koloniální nebo mnohobuněčné; nejsou to skutečné rostliny"}, {"q": "Jaké hlavní skupiny řas známe podle barvy?", "a": "Zelené řasy (Chlorophyta), hnědé řasy (Phaeophyta), rudé řasy (Rhodophyta), rozsivky (Bacillariophyta)"}, {"q": "Jak se řasy rozmnožují?", "a": "Nepohlavně (dělením buňky, výtrusy/sporami) i pohlavně (splynutím gamet)"}, {"q": "Kde žijí řasy?", "a": "Převážně ve vodním prostředí (sladkovodním i mořském), některé v půdě, na kůře stromů nebo v symbióze (lišejníky)"}, {"q": "Jaký je význam řas?", "a": "Hlavní producenti kyslíku a organické hmoty ve vodních ekosystémech; základ potravních řetězců; průmyslové využití (agar, algináty, potraviny)"}], "Mechorosty": [{"q": "Co jsou mechorosty?", "a": "Výtrusné suchozemské rostliny bez pravého cévního pletiva; vázané na vlhké prostředí pro pohlavní rozmnožování"}, {"q": "Jaké hlavní části má tělo mechorostů?", "a": "Stélka (listová nebo lupenitá); místo pravých kořenů mají rhizoidy přichycující rostlinu k podkladu"}, {"q": "Jak se mechorosty rozmnožují?", "a": "Pohlavně (gametofyt tvoří gamety) i nepohlavně (fragmentací nebo gemmami). K oplodnění potřebují vodu"}, {"q": "Jaký je životní cyklus mechorostů?", "a": "Dominuje gametofyt (zelená rostlina tvořící gamety); sporofyt je na gametofytu závislý a produkuje výtrusy"}, {"q": "Jaký je význam mechorostů?", "a": "Zadržují vodu v krajině, tvoří humus, zabraňují erozi; rašelina má ekonomický a ekologický význam"}], "Kapraďorosty": [{"q": "Co jsou kapraďorosty?", "a": "Výtrusné cévnaté rostliny s pravými kořeny, lodyhami a listy; nemají semena ani květy"}, {"q": "Jaký je životní cyklus kapraďorostů?", "a": "Střídání generací: sporofyt (velký, dominantní, tvoří výtrusy) a gametofyt (malý, samostatný – prothalium, tvoří gamety)"}, {"q": "Jak se kapraďorosty rozmnožují?", "a": "Nepohlavně výtrusy (sporami); pohlavně gametami tvořenými na prothalliu. K oplodnění nutná voda"}, {"q": "Jaké hlavní skupiny kapraďorostů známe?", "a": "Kapradiny (Pteridophyta), přesličky (Equisetophyta) a plavuně (Lycopodiophyta)"}, {"q": "Jaký je význam kapraďorostů?", "a": "Producenti kyslíku; historicky tvořily uhelné sloje; některé druhy léčivé nebo okrasné"}], "Nahosemenné rostliny": [{"q": "Co jsou nahosemenné rostliny?", "a": "Semenné cévnaté rostliny, jejichž semena nejsou uzavřena v plodu – leží volně na šupinách šištic"}, {"q": "Jak se nahosemenné rostliny rozmnožují?", "a": "Pohlavně semeny; opylení větrem (anemogamie); nevytvářejí plody"}, {"q": "Jaké hlavní části mají nahosemenné rostliny?", "a": "Kořen, stonek (kmen), listy (jehlice nebo šupiny) a šištice (samčí a samičí)"}, {"q": "Jaké hlavní skupiny nahosemenných rostlin známe?", "a": "Jehličnany (Coniferales), cykasy (Cycadales), jinan (Ginkgo) a liánovníkovci (Gnetophyta)"}, {"q": "Jaký je význam nahosemenných rostlin?", "a": "Zdroj dřeva, pryskyřic a olejů; tvoří rozsáhlé lesní ekosystémy (tajga); produkují kyslík"}], "Krytosemenné rostliny": [{"q": "Co jsou krytosemenné rostliny?", "a": "Nejpočetnější skupina semenných rostlin; semena jsou uzavřena v plodu, který vzniká ze semeníku pestíku"}, {"q": "Jak se krytosemenné rostliny rozmnožují?", "a": "Pohlavně semeny vznikajícími po opylení a dvojitém oplození; tvoří plody"}, {"q": "Jaké hlavní části má květ krytosemenných rostlin?", "a": "Kalich (kališní lístky), koruna (korunní lístky), tyčinky (samčí orgány) a pestík (samičí orgán)"}, {"q": "Jaké hlavní skupiny krytosemenných rostlin známe?", "a": "Dvouděložné (Dicotyledonae) a jednoděložné (Monocotyledonae)"}, {"q": "Jaký je význam krytosemenných rostlin?", "a": "Základní zdroj potravy, léčiv, dřeva, vláken a okrasných rostlin pro člověka; producenti kyslíku"}], "Kořen, stonek, list": [{"q": "Co je kořen a jaká je jeho hlavní funkce?", "a": "Podzemní orgán rostliny; upevňuje rostlinu v půdě, přijímá vodu a minerální látky, může sloužit jako zásobní orgán"}, {"q": "Jaké základní typy kořenů známe?", "a": "Kůlový kořen (s hlavním kořenem, např. mrkev) a svazčitý (fascikulární) kořen (trsy stejně silných kořenů, např. trávy)"}, {"q": "Jaké jsou hlavní části kořene?", "a": "Kořenová čepička, dělivá zóna (meristém), prodlužovací zóna, zóna kořenových vlásků (diferenciace)"}, {"q": "Jak se kořen podílí na příjmu vody a živin?", "a": "Kořenové vlásky zvětšují savný povrch; voda a minerály jsou přijímány osmózou a aktivním transportem"}, {"q": "Jaké specializované funkce mohou mít kořeny?", "a": "Zásobní (bulvy, řepy), vzdušné (mangrovy), přísavné (břečťan), dýchací (pneumatofory), příčepivé"}, {"q": "Co je stonek a jaká je jeho hlavní funkce?", "a": "Nadzemní orgán nesoucí listy, květy a plody; transportuje látky mezi kořeny a listy; zajišťuje mechanickou oporu"}, {"q": "Jaké základní typy stonků známe?", "a": "Bylinný (měkký, zelený, bez druhotného tloustnutí) a dřevnatý (tvrdý, s dřevem a lýkem)"}, {"q": "Jaké hlavní části má stonek?", "a": "Uzliny (nody), internodia (mezičlánky), pupeny (apikální a axilární); u dřevin dřevo (xylém) a lýko (floém)"}, {"q": "Jaké specializované stonky existují?", "a": "Oddenky (rhizomy), hlízy (brambor), cibule (cibule), šlahouny (jahoda), popínavé stonky, trny (hloh)"}, {"q": "Jaký je význam stonku pro rostlinu?", "a": "Transport vody, minerálů a asimilátů; mechanická opora; vegetativní rozmnožování; fotosyntetická funkce (u zelených stonků)"}, {"q": "Co je list a jaká je jeho hlavní funkce?", "a": "Postranní orgán stonku; hlavní funkce: fotosyntéza, transpirace a výměna plynů (přes průduchy)"}, {"q": "Jaké základní části má list?", "a": "Čepel (lamina), řapík, báze listu (někdy i palisty)"}, {"q": "Jaké typy žilnatiny rozlišujeme u listů?", "a": "Zpeřená (u dvouděložných, např. dub), dlanivá (javor), souběžná (u jednoděložných, např. trávy), vidličnatá"}, {"q": "Jaký je význam průduchů na listech?", "a": "Regulují výměnu plynů (CO₂ dovnitř, O₂ ven) a transpiraci; přes průduchy také dochází ke ztrátám vody"}, {"q": "Jaké speciální typy listů existují?", "a": "Zásobní (cibulové šupiny), úponky (hrachor), trny (kaktusy), lapací (masožravé rostliny), šupiny, jehlice"}], "Květ, opylení, oplození": [{"q": "Co je květ a jaká je jeho hlavní funkce?", "a": "Reprodukční orgán krytosemenných rostlin; zajišťuje pohlavní rozmnožování – tvorbu semen a plodů"}, {"q": "Jaké části tvoří květ?", "a": "Stopka, lůžko, kalich (kališní lístky), koruna (korunní lístky), tyčinky (prašníky + nitky) a pestík (blizna + čnělka + semeník)"}, {"q": "Jak se květ podílí na rozmnožování rostlin?", "a": "V tyčinkách vznikají pylová zrna, v semeníku vajíčka; po opylení a oplození vznikají semena a z plodolistů plod"}, {"q": "Jaké typy květů rozlišujeme podle pohlaví?", "a": "Oboupohlavné (hermafroditní – tyčinky i pestík), jednopohlavné (butozní nebo pistilátní)"}, {"q": "Jaký je význam květů pro rostliny a člověka?", "a": "Umožňují pohlavní rozmnožování; lákají opylovače; člověk využívá jako okrasné, léčivé nebo potravinářské"}, {"q": "Co je opylení?", "a": "Přenos pylových zrn z prašníku na bliznu pestíku (téhož nebo jiného květu)"}, {"q": "Jaké hlavní způsoby opylení známe?", "a": "Větrem (anemogamie), hmyzem (entomogamie), ptáky (ornitogamie), vodou (hydrogamie); samoopylení nebo cizoopylení"}, {"q": "Co je oplození?", "a": "Splynutí samčí gamety (spermie z pylové láčky) se samičí gametou (vaječnou buňkou), vznik zygoty"}, {"q": "Jak probíhá oplození u krytosemenných rostlin?", "a": "Dvojité oplození: jedna spermie splyne s vaječnou buňkou (→ zygota → zárodek), druhá s centrální buňkou (→ endosperm)"}, {"q": "Jaký je výsledek opylení a oplození?", "a": "Vznik semene (zárodek + endosperm + osemení) a plodu (přeměněný semeník); zajišťuje genetickou variabilitu"}], "Významné čeledi rostlin": [{"q": "Co znamená pojem 'čeleď' v botanice?", "a": "Taxonomická jednotka zahrnující příbuzné rody sdílející společné morfologické a fylogenetické znaky"}, {"q": "Jaká čeleď zahrnuje obiloviny?", "a": "Lipnicovité (Poaceae) – pšenice, ječmen, žito, oves, rýže, kukuřice, proso"}, {"q": "Která čeleď zahrnuje luštěniny?", "a": "Bobovité (Fabaceae) – hrách, fazole, čočka, sója, bob, jetel, vojtěška"}, {"q": "Jaká čeleď zahrnuje okrasné a ovocné keře a stromy?", "a": "Růžovité (Rosaceae) – jabloně, hrušně, třešně, slívy, jahody, maliny, růže"}, {"q": "Která čeleď zahrnuje rajčata, brambory a papriky?", "a": "Lilkovité (Solanaceae) – rajče, brambor, paprika, lilek, tabák, rulík zlomocný"}, {"q": "Jaká čeleď zahrnuje slunečnice a kopretiny?", "a": "Hvězdnicovité (Asteraceae) – slunečnice, heřmánek, kopretina, pampelišky, artyčok, čekanka"}, {"q": "Která čeleď zahrnuje řepu, špenát a merlík?", "a": "Merlíkovité (Amaranthaceae, dříve Chenopodiaceae) – cukrová řepa, mangold, špenát, amarant"}, {"q": "Jaká čeleď zahrnuje brokolici, řepku a hořčici?", "a": "Brukvovité (Brassicaceae) – zelí, brokolice, kedlubny, řepka, ředkev, hořčice"}, {"q": "Která čeleď zahrnuje mrkev, petržel a kopr?", "a": "Miříkovité (Apiaceae) – mrkev, petržel, kopr, fenykl, celer, kmín, bolehlav"}, {"q": "Jaký je hospodářský a ekologický význam krytosemenných čeledí?", "a": "Jsou zdrojem potravin, krmiv, olejů, vláken, léčiv, koření a okrasných rostlin; tvoří základ ekosystémů"}], "Ekologie": [{"q": "Co je ekologie?", "a": "Věda studující vztahy mezi organismy navzájem a vztahy organismů k jejich prostředí"}, {"q": "Co je ekosystém?", "a": "Funkční jednotka tvořená společenstvem organismů (biocenózou) a jejich neživým prostředím (biotopem), v níž probíhá koloběh látek a tok energie"}, {"q": "Co je biotop a biocenóza?", "a": "Biotop: neživé prostředí (fyzikální a chemické faktory). Biocenóza: soubor všech druhů organismů žijících v daném biotopu"}, {"q": "Co jsou producenti, konzumenti a rozkladači?", "a": "Producenti: autotrofní organismy (fotosyntetizující). Konzumenti: heterotrofní (živočichové). Rozkladači: bakterie a houby rozkládající mrtvou hmotu"}, {"q": "Co je potravní řetězec a potravní pyramida?", "a": "Potravní řetězec: posloupnost organismů přenášejících energii (producent→konzument 1→konzument 2…). Pyramida: grafické znázornění biomasy nebo počtu na každé trofické úrovni"}, {"q": "Co je ekologická nika?", "a": "Souhrn nároků organismu na prostředí a jeho funkční role v ekosystému (co jí, kde žije, jak se rozmnožuje)"}, {"q": "Co je biodiverzita?", "a": "Biologická rozmanitost – zahrnuje druhovou, genetickou a ekosystémovou diverzitu; ukazatel zdraví ekosystémů"}, {"q": "Jak se liší suchozemské a vodní ekosystémy?", "a": "Suchozemské: les, louka, step, poušť – limituje voda. Vodní: řeka, jezero, moře, bažina – limituje světlo a živiny"}, {"q": "Co je ekologická sukcese?", "a": "Postupná, předvídatelná změna druhového složení ekosystému v čase; končí klimaxovým (stabilním) společenstvem"}, {"q": "Jaký má ekologie význam pro člověka?", "a": "Pomáhá porozumět fungování přírody, trvale udržitelně hospodařit s přírodními zdroji a chránit životní prostředí"}], "Viry": [{"q": "Co jsou viry?", "a": "Nebuněčné infekční částice tvořené nukleovou kyselinou (DNA nebo RNA) a bílkovinným obalem (kapsidou); množení jen uvnitř hostitelských buněk"}, {"q": "Jaké složky má virová částice (virion)?", "a": "Nukleová kyselina (DNA nebo RNA), kapsida (bílkovinný obal z kapsomerů) a u obalených virů lipidový obal s glykoproteiny"}, {"q": "Jak se viry rozmnožují?", "a": "Pouze uvnitř hostitelských buněk – přichytí se na receptor, vpraví genetickou informaci, využijí buněčný aparát k syntéze nových virionů"}, {"q": "Jaký je rozdíl mezi DNA a RNA viry?", "a": "DNA viry: genetická informace v dvouvláknové DNA (herpesviry, adenoviry). RNA viry: v RNA (chřipkový virus, HIV, koronaviry)"}, {"q": "Co je lytický cyklus viru?", "a": "Vir vstoupí do buňky, rychle se množí a buňku lyžuje (rozruší) – uvolní nové viriony, které infikují další buňky"}, {"q": "Co je lyzogenní cyklus viru?", "a": "Virová DNA se začlení do chromozomu hostitele jako provirus; zůstává neaktivní a dělí se s buňkou; může být spuštěn stresem"}, {"q": "Jaké choroby způsobují viry u člověka?", "a": "Chřipka, nachlazení, COVID-19, HIV/AIDS, spalničky, plané neštovice, příušnice, žloutenka, klíšťová encefalitida, herpes"}, {"q": "Proč antibiotika nepůsobí na viry?", "a": "Antibiotika cílí na bakteriální struktury (buněčnou stěnu, ribozomy). Viry tyto struktury nemají; proti virům se používají antivirotika"}, {"q": "Jakou roli hraje očkování v boji proti virům?", "a": "Stimuluje imunitní systém k tvorbě protilátek a paměťových buněk; při setkání s virem reaguje rychleji a silněji – ochrana před nemocí"}, {"q": "Co jsou bakteriofágy?", "a": "Viry napadající výhradně bakterie; využívají se v molekulární biologii (klonování) a výzkumu fágové terapie"}]};

  function setMode(m) {
    mode = m;
    document.getElementById('mbP').classList.toggle('active', m==='p');
    document.getElementById('mbO').classList.toggle('active', m==='o');
    document.getElementById('aP').style.display = m==='p' ? '' : 'none';

  function getSections() {
    return Array.from(document.querySelectorAll('.cc')).filter(c=>c.checked).map(c=>c.value);
  }
  function setAll(v) { document.querySelectorAll('.cc').forEach(c=>c.checked=v); }

  function validate() {
    const cls=document.getElementById('cls').value;
    const qc=parseInt(document.getElementById('qc').value)||0;
    const secs=getSections();
    if (!cls) { showWarn('Vyber třídu.'); return null; }
    if (!secs.length) { showWarn('Vyber alespoň jeden okruh.'); return null; }
    if (qc<1) { showWarn('Zadej počet otázek.'); return null; }
    hideWarn();
    const pin=parseInt(document.getElementById('pin').value)||1234;
    const tmin=parseInt(document.getElementById('tmin').value)||15;
    return {cls, sc:parseInt(document.getElementById('sc').value)||2, td:document.getElementById('td').value, qc, secs, pin, tmin};
  }

  function showWarn(m) { document.getElementById('warnBox').textContent=m; document.getElementById('warnBox').style.display=''; }
  function hideWarn() { document.getElementById('warnBox').style.display='none'; }

  function shuffle(arr) {
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  }
  function genTest(qc, secs) {
    const tot=secs.reduce((s,sec)=>s+(questionsDatabase[sec]?.length||0),0);
    let sel=[];
    secs.forEach(sec=>{
      const pool=shuffle([...questionsDatabase[sec]]);
      const cnt=Math.round(qc*pool.length/tot);
      pool.slice(0,Math.min(cnt,pool.length)).forEach(q=>sel.push({...q,section:sec}));
    });
    sel=sel.slice(0,qc);
    shuffle(sel);
    return sel;
  }

  function dlFile(content, name, type) {
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function genPrint() {
    const p=validate(); if(!p) return;
    const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const sn=p.secs.join(', ');
    let c=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@media print{.tp{page-break-after:always}.tp:last-child{page-break-after:auto}}
@media screen{.tp{border-bottom:3px solid #999;margin-bottom:30px;padding-bottom:20px}}

</style></head><body>`;
    for(let i=0;i<p.sc;i++) {
      if(i>0) c+='<br clear=all style="page-break-before:always">';
      const qs=genTest(p.qc,p.secs);
      c+=`<h1>TEST — BIOLOGIE — 1. ROČNÍK</h1>
<div class="hd">
  <p><strong>Jméno a příjmení:</strong> ___________________________</p>
  <p><strong>Třída:</strong> ${p.cls} &nbsp; <strong>Datum:</strong> ${p.td} &nbsp; <strong>Varianta:</strong> ${L[i]||i+1}</p>
  <p style="font-size:8pt;color:#555"><strong>Okruhy:</strong> ${sn.length>90?sn.slice(0,90)+'…':sn}</p>
</div>`;
      qs.forEach((q,j)=>{c+=`<div class="q"><p class="qt">${j+1}. ${q.q}</p><div class="af">&nbsp;</div><p class="pts">Bodů: _____</p></div>`;});
      c+=`<div class="sum"><h2>HODNOCENÍ</h2><br><p><strong>Celkem bodů:</strong> __________ / ${p.qc}</p><br><p><strong>Známka:</strong> ________________</p></div>`;
    }
    c+='</body></html>';
    dlFile(c, `testy_biologie_1rocnik_${p.cls}_${p.td}.doc`, 'application/msword');
    document.getElementById('okTxt') && (document.getElementById('okBox').innerHTML='<strong>✅ Hotovo!</strong> ' + p.sc + ' testů pro třídu ' + p.cls);
    document.getElementById('okBox').style.display='';
  }

  function genOnline() {
    const p=validate(); if(!p) return;
    const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const variants=[];
    for(let i=0;i<p.sc;i++) variants.push(genTest(p.qc,p.secs));
    const varJSON=JSON.stringify(variants);
    const varOpts=Array.from({length:p.sc},(_,i)=>`<option value="${i}">Varianta ${L[i]||i+1}</option>`).join('');

    const onlineHTML = buildOnlineHTML(p, varJSON, varOpts, L);
    dlFile(onlineHTML, `test_ONLINE_biologie_1rocnik_${p.cls}_${p.td}.html`, 'text/html');
    document.getElementById('okBox').innerHTML='<strong>✅ Online test vygenerován!</strong><br>'

  }

function startTest(){

  for(var _i=cv.length-1;_i>0;_i--){var _j=Math.floor(Math.random()*(_i+1));var _t=cv[_i];cv[_i]=cv[_j];cv[_j]=_t;}
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';sVar='Varianta '+(L[vi]||vi+1);
  document.getElementById('tMeta').textContent=sN+' | '+sVar+' | ${p.cls} | ${p.td}';

function renderTest(){

function upd(){

    if(e&&e.value.trim()){f++;if(c)c.className='qC done';}else{if(c)c.className='qC';}
  });
  document.getElementById('pF').style.width=Math.round(f/cv.length*100)+'%';
}


  var timerInterval=null;
  function startTimer(){
    var total=TMIN*60;
    var remaining=total;
    function tick(){
      remaining--;
      if(remaining<0){clearInterval(timerInterval);submitTest();return;}
      var m=Math.floor(remaining/60);
      var s=remaining%60;
      var txt=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
      var pct=Math.round(remaining/total*100);
      var isRed=remaining<120;
      var fill=document.getElementById('tmrFill');
      var tmrTxt=document.getElementById('tmrTxt');
      if(fill){fill.style.width=pct+'%';fill.className='tmr-fill'+(isRed?' red':'');}
      if(tmrTxt){tmrTxt.textContent=txt;tmrTxt.className='tmr-txt'+(isRed?' red':'');}
    }
    tick();
    timerInterval=setInterval(tick,1000);
  }
