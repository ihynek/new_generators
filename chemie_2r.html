<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generátor — CHEMIE — 2. ročník</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#0891b2,#0e7490);padding:24px;min-height:100vh}
    .container{max-width:820px;margin:0 auto}
    .card{background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:32px;margin-bottom:24px}
    h1{font-size:24px;font-weight:700;color:#1f2937;margin-bottom:20px;text-align:center}
    h2{font-size:15px;font-weight:600;color:#374151;margin-bottom:10px}
    .info{background:#eff6ff;border-radius:8px;padding:13px 16px;margin-bottom:18px;font-size:13px;color:#374151;line-height:1.6}
    .fg{margin-bottom:13px}
    .fg label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
    input,select{width:100%;padding:9px 12px;border:2px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;background:white}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .msw{display:flex;border:2px solid #d1d5db;border-radius:10px;overflow:hidden;margin-bottom:14px}
    .mb{flex:1;padding:11px;background:white;border:none;cursor:pointer;font-size:14px;font-weight:500;color:#6b7280}
    .mb.active{background:linear-gradient(to right,#0891b2,#0e7490);color:white}
    .mi{background:#f9fafb;border:2px solid #e5e7eb;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#374151}
    .cbox{border:2px solid #e5e7eb;border-radius:12px;padding:15px;margin-bottom:18px}
    .chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:8px}
    .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px}
    .ci{border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 10px}
    .ci:has(.cc:checked){border-color:#0891b2;background:#eff6ff}
    .cl{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
    .cl input{width:14px;height:14px;accent-color:#0891b2;flex-shrink:0}
    .cn{flex:1;color:#374151;font-weight:500}
    .cb{background:#e5e7eb;color:#6b7280;font-size:11px;padding:1px 7px;border-radius:20px}
    .ci:has(.cc:checked) .cb{background:#0891b2;color:white}
    .cbtn{padding:5px 11px;border-radius:6px;border:1.5px solid #d1d5db;background:white;cursor:pointer;font-size:12px;font-weight:600;color:#374151}
    .btn{padding:13px;border-radius:8px;font-weight:600;border:none;cursor:pointer;font-size:15px;width:100%;margin-top:7px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
    .bp{background:linear-gradient(to right,#0891b2,#0e7490);color:white}
    .bo{background:linear-gradient(to right,#10b981,#059669);color:white}
    .bs{background:linear-gradient(to right,#6b7280,#4b5563);color:white;margin-top:13px}
    .warn{background:#fef3c7;border:2px solid #fbbf24;border-radius:8px;padding:11px;margin-top:12px;display:none;text-align:center;font-size:13px;color:#92400e}
    .ok{background:#d1fae5;border:2px solid #10b981;border-radius:8px;padding:13px;margin:12px 0;display:none;font-size:13px;color:#065f46}
    .tip{background:#dbeafe;border-radius:8px;padding:13px;margin-top:18px;font-size:13px;color:#1e40af;line-height:1.5}
  </style>
</head>
<body>
<div class="container"><div class="card">
  <h1>🧪 Generátor testů — CHEMIE — 2. ročník</h1>

  <div class="msw">
    <button class="mb active" id="mbP" onclick="setMode('p')">📄 Papírová verze</button>
    <button class="mb" id="mbO" onclick="setMode('o')">💻 Online verze</button>
  </div>
  <div class="mi" id="mInfo">📄 <strong>Papírová verze:</strong> Testy k tisku, studenti píší rukou.</div>

  <div class="info" id="infoBox"></div>

  <div class="fg"><label>Třída:</label>
    <select id="cls"><option value="">-- Vyber třídu --</option><option value="2.A">2.A</option>
<option value="2.B">2.B</option>
<option value="6SA">6SA</option></select>
  </div>
  <div class="row">
    <div class="fg"><label>Počet studentů / variant:</label><input type="number" id="sc" value="2" min="1" max="50"></div>

    <div class="fg"><label>Datum testu:</label><input type="date" id="td"></div>
  </div>
  <div class="row">
    <div class="fg"><label>Otázek na test:</label><input type="number" id="qc" value="20" min="1" max="60"></div>
    <div class="fg"><label>Čas na test (min):</label><input type="number" id="tmin" value="15" min="1" max="90"></div>
    <div class="fg">
      <label>&#128274; PIN pro učitele (zapiš si ho!):</label>
      <input type="number" id="pin" value="1234" min="1000" max="9999" placeholder="4 číslice"
        style="font-size:20px;font-weight:700;letter-spacing:4px;color:#6366f1;border-color:#6366f1"
        oninput="document.getElementById('pinShow').textContent=this.value">
      <div style="font-size:13px;color:#6b7280;margin-top:5px">
        Učitel zadá tento PIN při hodnocení: <strong id="pinShow" style="color:#6366f1;font-size:16px">1234</strong>
      </div>
    </div>
  </div>

  <div class="cbox">
    <div class="chdr">
      <h2>📚 Tematické okruhy</h2>
      <div style="display:flex;gap:7px">
        <button class="cbtn" onclick="setAll(true)">✅ Vše</button>
        <button class="cbtn" onclick="setAll(false)">❌ Zrušit</button>
      </div>
    </div>
    <div class="cgrid">
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Anorganika - bor a hliník" checked>
          <span class="cn">Anorganika - bor a hliník</span><span class="cb">3 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Anorganika - uhlík a křemík" checked>
          <span class="cn">Anorganika - uhlík a křemík</span><span class="cb">3 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Anorganika - dusík a fosfor" checked>
          <span class="cn">Anorganika - dusík a fosfor</span><span class="cb">4 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Anorganika - síra" checked>
          <span class="cn">Anorganika - síra</span><span class="cb">2 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Anorganika - halogeny a vzácné plyny" checked>
          <span class="cn">Anorganika - halogeny a vzácné plyny</span><span class="cb">4 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Anorganika - kovy a koordinační sloučeniny" checked>
          <span class="cn">Anorganika - kovy a koordinační sloučeniny</span><span class="cb">5 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Uhlovodíky - základní pojmy" checked>
          <span class="cn">Uhlovodíky - základní pojmy</span><span class="cb">6 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Deriváty uhlovodíků" checked>
          <span class="cn">Deriváty uhlovodíků</span><span class="cb">8 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Základní reakce" checked>
          <span class="cn">Základní reakce</span><span class="cb">8 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Specifické reakce" checked>
          <span class="cn">Specifické reakce</span><span class="cb">11 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Izomerie a stereochemie" checked>
          <span class="cn">Izomerie a stereochemie</span><span class="cb">14 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Reakce pravidla a mechanismy" checked>
          <span class="cn">Reakce pravidla a mechanismy</span><span class="cb">9 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Skupiny a vazby" checked>
          <span class="cn">Skupiny a vazby</span><span class="cb">6 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Polymery a peptidy" checked>
          <span class="cn">Polymery a peptidy</span><span class="cb">2 ot.</span>
        </label></div></div>
  </div>

  <div id="aP"><button class="btn bp" onclick="genPrint()">📄 Vygenerovat testy k tisku</button></div>
  <div id="aO" style="display:none"><button class="btn bo" onclick="genOnline()">💻 Vygenerovat online test</button></div>

  <button class="btn bs" onclick="location.href='dexin.html'">← Zpět na rozcestník</button>

  <div class="warn" id="warnBox"></div>
  <div class="ok" id="okBox"></div>
  <div class="tip" id="tipBox">💡 Vyber tematické okruhy, nastav parametry a vygeneruj.</div>
</div></div>

<script>
  const questionsDatabase = {"Anorganika - bor a hliník": [{"q": "Jaké jsou vlastnosti, využití a výskyt boru (B)?", "a": "Polokov, tvrdý, špatný vodič; vyskytuje se v boraxu; využití v optickém skle, jaderných reaktorech a bórování oceli."}, {"q": "Jaké jsou vlastnosti, využití a výskyt hliníku (Al)?", "a": "Lehký stříbřitý kov, dobrý vodič, odolný vůči korozi (pasivace); nejrozšířenější kov v zemské kůře; využití v letectví, obalech a elektrotechnice."}, {"q": "Jaké jsou sloučeniny hliníku?", "a": "Oxid hlinitý (Al₂O₃, korund), hydroxid hlinitý (Al(OH)₃), síran hlinitý (Al₂(SO₄)₃), chlorid hlinitý (AlCl₃)."}], "Anorganika - uhlík a křemík": [{"q": "Jaké jsou vlastnosti, využití a výskyt uhlíku?", "a": "Vyskytuje se jako diamant (tvrdý, izolant) a grafit (měkký, vodič); základ organické chemie; využití v elektrodách, filtraci a jako palivo."}, {"q": "Jaké jsou vlastnosti, využití a výskyt křemíku?", "a": "Polokov, druhý nejrozšířenější prvek zemské kůry (SiO₂, silikáty); využití v polovodičích, solárních článcích a skle."}, {"q": "Jaké jsou sloučeniny uhlíku a křemíku?", "a": "Uhlík: CO, CO₂, uhličitany, karbidy. Křemík: SiO₂ (křemen), silikáty, silicidy, silikony."}], "Anorganika - dusík a fosfor": [{"q": "Jaké jsou vlastnosti, využití a výskyt dusíku?", "a": "Bezbarvý plyn (78 % atmosféry), inertní za normálních podmínek; využití ve výrobě amoniaku (Haber-Boschův proces), kapalný N₂ v kryogenice."}, {"q": "Jaké jsou sloučeniny dusíku?", "a": "Amoniak (NH₃), kyselina dusičná (HNO₃), kyselina dusitá (HNO₂), oxidy dusíku (NOₓ), dusičnany a dusitany."}, {"q": "Jaké jsou vlastnosti, využití a výskyt fosforu?", "a": "Vyskytuje se jako bílý (jedovatý, reaktivní) a červený fosfor; v přírodě jako fosfáty; využití v hnojivech, zápalech a detergenty."}, {"q": "Jaké jsou sloučeniny fosforu?", "a": "Oxid fosforečný (P₄O₁₀), kyselina fosforečná (H₃PO₄), fosfáty, fosfonáty."}], "Anorganika - síra": [{"q": "Jaké jsou vlastnosti, využití a výskyt síry?", "a": "Žlutý nekovový pevný prvek; vyskytuje se v přírodě volně i jako sulfidy a sírany; využití při výrobě kyseliny sírové, vulkanizaci kaučuku a v zemědělství."}, {"q": "Jaké jsou sloučeniny síry?", "a": "Oxid siřičitý (SO₂), oxid sírový (SO₃), kyselina sírová (H₂SO₄), kyselina siřičitá (H₂SO₃), sulfidy, sírany."}], "Anorganika - halogeny a vzácné plyny": [{"q": "Jaké jsou vlastnosti, využití a výskyt chloru?", "a": "Žlutozelený jedovatý plyn; průmyslově vyráběn elektrolýzou NaCl; využití k dezinfekci vody, výrobě PVC a bělení."}, {"q": "Jaké jsou vlastnosti, využití a výskyt fluoru?", "a": "Nejreaktivnější nekov, bledě žlutý plyn; vyskytuje se jako fluorit (CaF₂); využití ve výrobě teflonu, zubních past a jako raketové palivo."}, {"q": "Jaké jsou sloučeniny halogenů?", "a": "Chlorovodík (HCl), fluorovodík (HF), chloridy, fluoridy, bromidy, jodidy, halogenové kyseliny."}, {"q": "Jaké jsou vlastnosti, využití a výskyt vzácných plynů?", "a": "Jednoatomové plyny (He, Ne, Ar, Kr, Xe, Rn), velmi nereaktivní; He v balónech, Ne v reklamních světlech, Ar v žárovkách, Xe v projektorech."}], "Anorganika - kovy a koordinační sloučeniny": [{"q": "Jaké jsou vlastnosti, využití a výskyt železa?", "a": "Nejpoužívanější kov, magnetický, koroduje; vyskytuje se jako hematit (Fe₂O₃) a magnetit (Fe₃O₄); využití v ocelářství, strojírenství a stavebnictví."}, {"q": "Jaké jsou vlastnosti, využití a výskyt mědi?", "a": "Červenohnědý kov, výborný vodič tepla i elektřiny; vyskytuje se jako chalkopyrit (CuFeS₂); využití v elektrotechnice, vodovodním potrubí a slitinách."}, {"q": "Co jsou koordinační sloučeniny a jejich názvosloví?", "a": "Sloučeniny s centrálním atomem (kovem) obklopeným ligandy; název: ligandy + název kovu + náboj v závorce (př. hexaamminkobalt(III) chlorid)."}, {"q": "Jaké jsou vlastnosti, využití a výskyt lanthanoidů?", "a": "15 prvků (La–Lu), stříbřitě šedé kovy s podobnými vlastnostmi; využití v magnetech, katalyzátorech, luminoforech a optice."}, {"q": "Jaké jsou vlastnosti, využití a výskyt aktinoidů?", "a": "15 prvků (Ac–Lr), většina radioaktivní; uran a thorium jako jaderná paliva, plutonium v jaderných zbraních."}], "Uhlovodíky - základní pojmy": [{"q": "Co jsou uhlovodíky?", "a": "Organické sloučeniny obsahující pouze uhlík a vodík."}, {"q": "Co jsou alkany?", "a": "Nasycené uhlovodíky s pouze jednoduchými vazbami C–C; obecný vzorec CₙH₂ₙ₊₂ (př. metan, etan, propan)."}, {"q": "Co jsou alkeny?", "a": "Nenasycené uhlovodíky s jednou dvojnou vazbou C=C; obecný vzorec CₙH₂ₙ (př. ethen, propen)."}, {"q": "Co jsou alkyny?", "a": "Nenasycené uhlovodíky s jednou trojnou vazbou C≡C; obecný vzorec CₙH₂ₙ₋₂ (př. ethyn/acetylen)."}, {"q": "Co jsou areny?", "a": "Aromatické uhlovodíky s benzenových kruhem (delokalizované π elektrony); základní je benzen C₆H₆."}, {"q": "Co je aromaticita?", "a": "Vlastnost cyklických konjugovaných systémů se zvláštní stabilitou díky delokalizaci π elektronů (splňují Hückelovo pravidlo: 4n+2 π elektronů)."}], "Deriváty uhlovodíků": [{"q": "Co jsou deriváty uhlovodíků?", "a": "Sloučeniny vzniklé náhradou jednoho nebo více atomů vodíku v uhlovodíku jinou funkční skupinou."}, {"q": "Co jsou alkoholy?", "a": "Deriváty uhlovodíků s hydroxylovou skupinou –OH vázanou na alifatický uhlík (př. ethanol C₂H₅OH)."}, {"q": "Co jsou fenoly?", "a": "Aromatické sloučeniny s hydroxylovou skupinou –OH vázanou přímo na benzenový kruh (př. fenol C₆H₅OH)."}, {"q": "Co jsou ethery?", "a": "Sloučeniny se skupinou R–O–R', kde kyslík je vázán na dva uhlovodíkové zbytky (př. diethylether)."}, {"q": "Co jsou estery?", "a": "Sloučeniny vzniklé reakcí kyseliny s alkoholem (esterifikací); mají skupinu –COO– (př. ethylacetát)."}, {"q": "Co jsou halogenalkany?", "a": "Deriváty uhlovodíků s halogenovým atomem (F, Cl, Br, I) místo vodíku (př. chlormetan CH₃Cl)."}, {"q": "Co je skupina hydroxylová?", "a": "Funkční skupina –OH charakteristická pro alkoholy a fenoly."}, {"q": "Co je nitroskupina?", "a": "Funkční skupina –NO₂ charakteristická pro nitrosloučeniny (př. nitrobenzen)."}], "Základní reakce": [{"q": "Co je adice?", "a": "Reakce, při níž se dvě molekuly spojují v jednu – typická pro nenasycené sloučeniny (př. adice HBr na ethen)."}, {"q": "Co je substituce?", "a": "Reakce, při níž je jeden atom nebo skupina nahrazena jiným atomem nebo skupinou."}, {"q": "Co je eliminace?", "a": "Reakce, při níž se z molekuly odštěpí malá molekula (HX, H₂O) a vznikne dvojná vazba."}, {"q": "Co je hydratace?", "a": "Adice vody (H₂O) na dvojnou nebo trojnou vazbu."}, {"q": "Co je hydrogenace?", "a": "Adice vodíku (H₂) na násobnou vazbu za přítomnosti katalyzátoru."}, {"q": "Co je hydrolýza?", "a": "Rozklad sloučeniny vodou (štěpení vazby za účasti H₂O)."}, {"q": "Co je esterifikace?", "a": "Reakce karboxylové kyseliny s alkoholem za vzniku esteru a vody."}, {"q": "Co je polymerace?", "a": "Reakce, při níž se mnoho malých molekul (monomerů) spojuje v dlouhý řetězec (polymer)."}], "Specifické reakce": [{"q": "Co je halogenace?", "a": "Zavedení halogenu do molekuly (substitucí nebo adicí)."}, {"q": "Co je chlorace?", "a": "Halogenace pomocí chloru (Cl₂)."}, {"q": "Co je bromace?", "a": "Halogenace pomocí bromu (Br₂)."}, {"q": "Co je nitrace?", "a": "Zavedení nitroskupiny –NO₂ do molekuly (typicky aromatických sloučenin)."}, {"q": "Co je sulfonace?", "a": "Zavedení sulfonové skupiny –SO₃H do molekuly reakcí s kyselinou sírovou."}, {"q": "Co je acylace?", "a": "Zavedení acylové skupiny R–CO– do molekuly."}, {"q": "Co je alkylace?", "a": "Zavedení alkylové skupiny (–CH₃, –C₂H₅ apod.) do molekuly."}, {"q": "Co je dehydratace?", "a": "Odštěpení vody z molekuly (eliminace H₂O)."}, {"q": "Co je dehydrogenace?", "a": "Odštěpení vodíku z molekuly za vzniku násobné vazby."}, {"q": "Co je dehalogenace?", "a": "Odstranění halogenu z molekuly."}, {"q": "Co je dehydrohalogenace?", "a": "Eliminace halogenvodíku (HX) z molekuly za vzniku dvojné vazby."}], "Izomerie a stereochemie": [{"q": "Co jsou isomery?", "a": "Sloučeniny se stejným molekulovým vzorcem, ale odlišným uspořádáním atomů."}, {"q": "Co jsou isomery konstituční?", "a": "Izomery lišící se pořadím, v němž jsou atomy vzájemně propojeny (strukturní izomery)."}, {"q": "Co jsou stereoisomery?", "a": "Izomery se stejným pořadím vazeb, ale odlišným prostorovým uspořádáním atomů."}, {"q": "Co jsou isomery konfigurační?", "a": "Stereizomery, jejichž vzájemná přeměna vyžaduje přerušení kovalentní vazby (cis/trans, R/S)."}, {"q": "Co jsou isomery konformační?", "a": "Různá prostorová uspořádání téže molekuly vzniklá otáčením kolem jednoduché vazby (bez přerušení vazby)."}, {"q": "Co je konformace cis/trans?", "a": "Geometrické izomery u dvojné vazby: cis – substituenty na stejné straně, trans – na opačných stranách."}, {"q": "Co je konformace židličková/vaničková?", "a": "Dvě základní konformace cyklohexanu: židličková je stabilnější (méně napjatá), vaničková méně stabilní."}, {"q": "Co je konformace zákrytová/nezákrytová?", "a": "Konformace ethanu: zákrytová (substituenty zakryty – méně stabilní), nezákrytová (střídavá – stabilnější)."}, {"q": "Co je chiralita?", "a": "Vlastnost molekuly, která není totožná se svým zrcadlovým obrazem (jako levá a pravá ruka)."}, {"q": "Co je centrum chirality?", "a": "Atom (nejčastěji uhlík) vázaný na čtyři různé substituenty."}, {"q": "Co jsou enantiomery?", "a": "Dva stereoizomery, které jsou vzájemným zrcadlovým obrazem a nelze je překrýt."}, {"q": "Co je racemát?", "a": "Směs rovnodílného množství obou enantiomerů; opticky neaktivní."}, {"q": "Co je aktivita optická?", "a": "Schopnost sloučeniny otáčet rovinu polarizovaného světla (vlastnost chirálních molekul)."}, {"q": "Co jsou anomery?", "a": "Stereizomery cukrů lišící se konfigurací na anomerním (hemiacetálovém) uhlíku – α a β forma."}], "Reakce pravidla a mechanismy": [{"q": "Co je Markovnikovo pravidlo?", "a": "Při adici nesymetrické molekuly (HX) na nesymetrický alken se vodík přidává na uhlík s více vodíky."}, {"q": "Co je Zajcevovo pravidlo?", "a": "Při eliminaci vzniká přednostně alken s více substituovanou dvojnou vazbou (stabilnější produkt)."}, {"q": "Co je elektrofil?", "a": "Částice s nedostatkem elektronů vyhledávající elektronové páry (Lewis-kyselina); př. H⁺, Br₂."}, {"q": "Co je nukleofil?", "a": "Částice s elektronovým párem, který poskytuje elektrofilu (Lewis-zásada); př. OH⁻, NH₃."}, {"q": "Co je radikál?", "a": "Částice s nepárovým elektronem, velmi reaktivní (př. Cl·, CH₃·)."}, {"q": "Co je přesmyk?", "a": "Přeskupení atomů nebo skupin v molekule vedoucí ke stabilnějšímu intermediátu nebo produktu."}, {"q": "Co je izomerace?", "a": "Přeměna jednoho izomeru v jiný (bez změny molekulového vzorce)."}, {"q": "Co je tautomerie?", "a": "Rovnováha mezi dvěma izomery vzájemně přeměnitelnými přenosem protonu (nejčastěji keto-enolová tautomerie)."}, {"q": "Co je enol?", "a": "Tautomerní forma ketonu/aldehydu s hydroxylovou skupinou na uhlíku s dvojnou vazbou C=C."}], "Skupiny a vazby": [{"q": "Co je alkyl?", "a": "Uhlovodíkový zbytek vzniklý odtržením jednoho vodíku od alkanu (př. metyl –CH₃, etyl –C₂H₅)."}, {"q": "Co je aryl?", "a": "Uhlovodíkový zbytek vzniklý odtržením vodíku z aromatického kruhu (př. fenyl –C₆H₅)."}, {"q": "Co je vazba jednoduchá?", "a": "Kovalentní vazba tvořená jedním párem sdílených elektronů (σ vazba)."}, {"q": "Co je vazba dvojná?", "a": "Kovalentní vazba tvořená dvěma páry sdílených elektronů (jedna σ a jedna π vazba)."}, {"q": "Co je vazba trojná?", "a": "Kovalentní vazba tvořená třemi páry sdílených elektronů (jedna σ a dvě π vazby)."}, {"q": "Co je vazba vodíková?", "a": "Mezimiolekulární nebo vnitromolekulární přitažlivá síla mezi vodíkem vázaným na elektronegativní atom (N, O, F) a dalším elektronegativním atomem."}], "Polymery a peptidy": [{"q": "Co jsou polymery?", "a": "Makromolekuly tvořené opakujícími se jednotkami (monomery) spojenými kovalentními vazbami (př. polyethylen, nylon)."}, {"q": "Co jsou peptidy?", "a": "Krátké řetězce aminokyselin spojených peptidovými vazbami (dipeptidy, tripeptidy až oligopeptidy)."}]};

  let mode = 'p';

  function setMode(m) {
    mode = m;
    document.getElementById('mbP').classList.toggle('active', m==='p');
    document.getElementById('mbO').classList.toggle('active', m==='o');
    document.getElementById('aP').style.display = m==='p' ? '' : 'none';
    document.getElementById('aO').style.display = m==='o' ? '' : 'none';

      ? '📄 <strong>Papírová verze:</strong> Testy k tisku, studenti píší rukou.'

      ? '💡 Každý student dostane jiné otázky (proporcionálně z vybraných okruhů).'
      : '💡 Po odevzdání se automaticky otevře hodnotící soubor v novém okně. Student ho uloží (Ctrl+S) a nahraje na disk W:// do určeného adresáře.';

  }

  function getSections() {
    return Array.from(document.querySelectorAll('.cc')).filter(c=>c.checked).map(c=>c.value);
  }
  function setAll(v) { document.querySelectorAll('.cc').forEach(c=>c.checked=v); }

  function validate() {
    const cls=document.getElementById('cls').value;
    const qc=parseInt(document.getElementById('qc').value)||0;
    const secs=getSections();
    if (!cls) { showWarn('Vyber třídu.'); return null; }
    if (!secs.length) { showWarn('Vyber alespoň jeden okruh.'); return null; }
    if (qc<1) { showWarn('Zadej počet otázek.'); return null; }
    hideWarn();
    const pin=parseInt(document.getElementById('pin').value)||1234;
    const tmin=parseInt(document.getElementById('tmin').value)||15;
    return {cls, sc:parseInt(document.getElementById('sc').value)||2, td:document.getElementById('td').value, qc, secs, pin, tmin};
  }

  function showWarn(m) { document.getElementById('warnBox').textContent=m; document.getElementById('warnBox').style.display=''; }
  function hideWarn() { document.getElementById('warnBox').style.display='none'; }

  function shuffle(arr) {
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  }
  function genTest(qc, secs) {
    const tot=secs.reduce((s,sec)=>s+(questionsDatabase[sec]?.length||0),0);
    let sel=[];
    secs.forEach(sec=>{
      const pool=shuffle([...questionsDatabase[sec]]);
      const cnt=Math.round(qc*pool.length/tot);
      pool.slice(0,Math.min(cnt,pool.length)).forEach(q=>sel.push({...q,section:sec}));
    });
    sel=sel.slice(0,qc);
    shuffle(sel);
    return sel;
  }

  function dlFile(content, name, type) {
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function genPrint() {
    const p=validate(); if(!p) return;
    const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const sn=p.secs.join(', ');
    let c=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@media print{.tp{page-break-after:always}.tp:last-child{page-break-after:auto}}
@media screen{.tp{border-bottom:3px solid #999;margin-bottom:30px;padding-bottom:20px}}

.hd p{margin:1.5px 0;font-size:9pt}
.q{border-bottom:1px solid #ddd;padding:2px 0;page-break-inside:avoid}
.qt{font-weight:bold;font-size:9pt}
.af{min-height:3em;padding:2px 3px}

</style></head><body>`;
    for(let i=0;i<p.sc;i++) {
      if(i>0) c+='<br clear=all style="page-break-before:always">';
      const qs=genTest(p.qc,p.secs);
      c+=`<h1>TEST — CHEMIE — 2. ROČNÍK</h1>
<div class="hd">
  <p><strong>Jméno a příjmení:</strong> ___________________________</p>
  <p><strong>Třída:</strong> ${p.cls} &nbsp; <strong>Datum:</strong> ${p.td} &nbsp; <strong>Varianta:</strong> ${L[i]||i+1}</p>
  <p style="font-size:8pt;color:#555"><strong>Okruhy:</strong> ${sn.length>90?sn.slice(0,90)+'…':sn}</p>
</div>`;
      qs.forEach((q,j)=>{c+=`<div class="q"><p class="qt">${j+1}. ${q.q}</p><div class="af">&nbsp;</div><p class="pts">Bodů: _____</p></div>`;});
      c+=`<div class="sum"><h2>HODNOCENÍ</h2><br><p><strong>Celkem bodů:</strong> __________ / ${p.qc}</p><br><p><strong>Známka:</strong> ________________</p></div>`;
    }
    c+='</body></html>';
    dlFile(c, `testy_chemie_2rocnik_${p.cls}_${p.td}.doc`, 'application/msword');
    document.getElementById('okTxt') && (document.getElementById('okBox').innerHTML='<strong>✅ Hotovo!</strong> ' + p.sc + ' testů pro třídu ' + p.cls);
    document.getElementById('okBox').style.display='';
  }

  function genOnline() {
    const p=validate(); if(!p) return;
    const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const variants=[];
    for(let i=0;i<p.sc;i++) variants.push(genTest(p.qc,p.secs));
    const varJSON=JSON.stringify(variants);
    const varOpts=Array.from({length:p.sc},(_,i)=>`<option value="${i}">Varianta ${L[i]||i+1}</option>`).join('');

    const onlineHTML = buildOnlineHTML(p, varJSON, varOpts, L);
    dlFile(onlineHTML, `test_ONLINE_chemie_2rocnik_${p.cls}_${p.td}.html`, 'text/html');
    document.getElementById('okBox').innerHTML='<strong>✅ Online test vygenerován!</strong><br>'
      +'<small>Sdílej soubor studentům. Po vyplnění student nahraje hodnotící soubor do Classroom.</small><br>'
      +'<strong style="color:#6366f1">🔒 PIN pro hodnocení: ' + p.pin + '</strong> (zapiš si ho!)';
    document.getElementById('okBox').style.display='';
  }

let cv=null,sN='',sVar='',curAns=[];

function startTest(){
  const ne=document.getElementById('sName'),ve=document.getElementById('vSel');
  sN=ne.value.trim();const vi=parseInt(ve.value);
  const err=document.getElementById('selErr');
  if(!sN){err.textContent='Zadej prosím své jméno.';err.style.display='block';ne.focus();return;}
  if(isNaN(vi)){err.textContent='Vyber variantu.';err.style.display='block';return;}
  err.style.display='none';
  cv=allV[vi];
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';sVar='Varianta '+(L[vi]||vi+1);
  document.getElementById('tMeta').textContent=sN+' | '+sVar+' | ${p.cls} | ${p.td}';
  renderTest();
  document.getElementById('scSel').style.display='none';
  document.getElementById('scTest').style.display='block';startTimer();
  window.scrollTo(0,0);
}

function renderTest(){
  const b=document.getElementById('tBod');b.innerHTML='';
  cv.forEach((item,i)=>{
    const d=document.createElement('div');d.className='qC';d.id='qc'+i;
    d.innerHTML='<div class="qH"><span class="qN">Otázka '+(i+1)+' / ${p.qc}</span><span class="qS">'+item.section+'</span></div>'
      +'<div class="qT">'+item.q+'</div>'
      +'<textarea class="qTA" id="a'+i+'" placeholder="Napiš svou odpověď..." oninput="upd()"></textarea>'
      +'<div class="qF"><span class="pb">max 2 body</span></div>';
    b.appendChild(d);
  });upd();
}

function upd(){
  let f=0;
  cv.forEach((_,i)=>{
    const e=document.getElementById('a'+i),c=document.getElementById('qc'+i);
    if(e&&e.value.trim()){f++;if(c)c.className='qC done';}else{if(c)c.className='qC';}
  });
  document.getElementById('pF').style.width=Math.round(f/cv.length*100)+'%';
}


  var timerInterval=null;
  function startTimer(){
    var total=TMIN*60;
    var remaining=total;
    function tick(){
      remaining--;
      if(remaining<0){clearInterval(timerInterval);submitTest();return;}
      var m=Math.floor(remaining/60);
      var s=remaining%60;
      var txt=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
      var pct=Math.round(remaining/total*100);
      var isRed=remaining<120;
      var fill=document.getElementById('tmrFill');
      var tmrTxt=document.getElementById('tmrTxt');
      if(fill){fill.style.width=pct+'%';fill.className='tmr-fill'+(isRed?' red':'');}
      if(tmrTxt){tmrTxt.textContent=txt;tmrTxt.className='tmr-txt'+(isRed?' red':'');}
    }
    tick();
    timerInterval=setInterval(tick,1000);
  }
function submitTest(){
  if(timerInterval)clearInterval(timerInterval);
  curAns=cv.map((item,i)=>{
    return{q:item.q,sec:item.section,sA:(document.getElementById('a'+i)||{value:''}).value.trim(),cA:item.a};
  });
  document.getElementById('dName').textContent=sN;
  document.getElementById('dVar').textContent=sVar;
  document.getElementById('scTest').style.display='none';
  document.getElementById('scDone').style.display='flex';
  window.scrollTo(0,0);
  openTeacherFile();
}
