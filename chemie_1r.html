<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generátor — CHEMIE — 1. ročník</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#9333ea,#7c3aed);padding:24px;min-height:100vh}
    .container{max-width:820px;margin:0 auto}
    .card{background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:32px;margin-bottom:24px}
    h1{font-size:24px;font-weight:700;color:#1f2937;margin-bottom:20px;text-align:center}
    h2{font-size:15px;font-weight:600;color:#374151;margin-bottom:10px}
    .info{background:#eff6ff;border-radius:8px;padding:13px 16px;margin-bottom:18px;font-size:13px;color:#374151;line-height:1.6}
    .fg{margin-bottom:13px}
    .fg label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
    input,select{width:100%;padding:9px 12px;border:2px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;background:white}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .msw{display:flex;border:2px solid #d1d5db;border-radius:10px;overflow:hidden;margin-bottom:14px}
    .mb{flex:1;padding:11px;background:white;border:none;cursor:pointer;font-size:14px;font-weight:500;color:#6b7280}
    .mb.active{background:linear-gradient(to right,#9333ea,#7c3aed);color:white}
    .mi{background:#f9fafb;border:2px solid #e5e7eb;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#374151}
    .cbox{border:2px solid #e5e7eb;border-radius:12px;padding:15px;margin-bottom:18px}
    .chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:8px}
    .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px}
    .ci{border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 10px}
    .ci:has(.cc:checked){border-color:#9333ea;background:#eff6ff}
    .cl{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
    .cl input{width:14px;height:14px;accent-color:#9333ea;flex-shrink:0}
    .cn{flex:1;color:#374151;font-weight:500}
    .cb{background:#e5e7eb;color:#6b7280;font-size:11px;padding:1px 7px;border-radius:20px}
    .ci:has(.cc:checked) .cb{background:#9333ea;color:white}
    .cbtn{padding:5px 11px;border-radius:6px;border:1.5px solid #d1d5db;background:white;cursor:pointer;font-size:12px;font-weight:600;color:#374151}
    .btn{padding:13px;border-radius:8px;font-weight:600;border:none;cursor:pointer;font-size:15px;width:100%;margin-top:7px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
    .bp{background:linear-gradient(to right,#9333ea,#7c3aed);color:white}
    .bo{background:linear-gradient(to right,#10b981,#059669);color:white}
    .bs{background:linear-gradient(to right,#6b7280,#4b5563);color:white;margin-top:13px}
    .warn{background:#fef3c7;border:2px solid #fbbf24;border-radius:8px;padding:11px;margin-top:12px;display:none;text-align:center;font-size:13px;color:#92400e}
    .ok{background:#d1fae5;border:2px solid #10b981;border-radius:8px;padding:13px;margin:12px 0;display:none;font-size:13px;color:#065f46}
    .tip{background:#dbeafe;border-radius:8px;padding:13px;margin-top:18px;font-size:13px;color:#1e40af;line-height:1.5}
  </style>
</head>
<body>
<div class="container"><div class="card">
  <h1>⚗️ Generátor testů — CHEMIE — 1. ročník</h1>

  <div class="msw">
    <button class="mb active" id="mbP" onclick="setMode('p')">📄 Papírová verze</button>
    <button class="mb" id="mbO" onclick="setMode('o')">💻 Online verze</button>
  </div>
  <div class="mi" id="mInfo">📄 <strong>Papírová verze:</strong> Testy k tisku, studenti píší rukou.</div>

  <div class="info" id="infoBox"></div>

  <div class="fg"><label>Třída:</label>
    <select id="cls"><option value="">-- Vyber třídu --</option><option value="1.A">1.A</option>
<option value="1.B">1.B</option>
<option value="5KA">5KA</option></select>
  </div>
  <div class="row">
    <div class="fg"><label>Počet studentů / variant:</label><input type="number" id="sc" value="2" min="1" max="50"></div>

    <div class="fg"><label>Datum testu:</label><input type="date" id="td"></div>
  </div>
  <div class="row">
    <div class="fg"><label>Otázek na test:</label><input type="number" id="qc" value="20" min="1" max="60"></div>
    <div class="fg"><label>Čas na test (min):</label><input type="number" id="tmin" value="15" min="1" max="90"></div>
    <div class="fg">
      <label>&#128274; PIN pro učitele (zapiš si ho!):</label>
      <input type="number" id="pin" value="1234" min="1000" max="9999" placeholder="4 číslice"
        style="font-size:20px;font-weight:700;letter-spacing:4px;color:#6366f1;border-color:#6366f1"
        oninput="document.getElementById('pinShow').textContent=this.value">
      <div style="font-size:13px;color:#6b7280;margin-top:5px">
        Učitel zadá tento PIN při hodnocení: <strong id="pinShow" style="color:#6366f1;font-size:16px">1234</strong>
      </div>
    </div>
  </div>

  <div class="cbox">
    <div class="chdr">
      <h2>📚 Tematické okruhy</h2>
      <div style="display:flex;gap:7px">
        <button class="cbtn" onclick="setAll(true)">✅ Vše</button>
        <button class="cbtn" onclick="setAll(false)">❌ Zrušit</button>
      </div>
    </div>
    <div class="cgrid">
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Základní pojmy" checked>
          <span class="cn">Základní pojmy</span><span class="cb">12 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Metody dělení směsí" checked>
          <span class="cn">Metody dělení směsí</span><span class="cb">4 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Kvantitativní chemie" checked>
          <span class="cn">Kvantitativní chemie</span><span class="cb">7 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Modely atomu a radioaktivita" checked>
          <span class="cn">Modely atomu a radioaktivita</span><span class="cb">12 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Kvantová čísla a orbitaly" checked>
          <span class="cn">Kvantová čísla a orbitaly</span><span class="cb">9 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Chemické vazby" checked>
          <span class="cn">Chemické vazby</span><span class="cb">10 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Chemické reakce" checked>
          <span class="cn">Chemické reakce</span><span class="cb">8 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Rychlost reakcí a rovnováha" checked>
          <span class="cn">Rychlost reakcí a rovnováha</span><span class="cb">8 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Redoxní reakce" checked>
          <span class="cn">Redoxní reakce</span><span class="cb">4 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Kyseliny a zásady" checked>
          <span class="cn">Kyseliny a zásady</span><span class="cb">6 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Periodická tabulka" checked>
          <span class="cn">Periodická tabulka</span><span class="cb">3 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Vodík a kyslík" checked>
          <span class="cn">Vodík a kyslík</span><span class="cb">3 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Alkalické kovy a kovy alkalických zemin" checked>
          <span class="cn">Alkalické kovy a kovy alkalických zemin</span><span class="cb">4 ot.</span>
        </label></div></div>
  </div>

  <div id="aP"><button class="btn bp" onclick="genPrint()">📄 Vygenerovat testy k tisku</button></div>
  <div id="aO" style="display:none"><button class="btn bo" onclick="genOnline()">💻 Vygenerovat online test</button></div>

  <button class="btn bs" onclick="location.href='dexin.html'">← Zpět na rozcestník</button>

  <div class="warn" id="warnBox"></div>
  <div class="ok" id="okBox"></div>
  <div class="tip" id="tipBox">💡 Vyber tematické okruhy, nastav parametry a vygeneruj.</div>
</div></div>

<script>
  const questionsDatabase = {"Základní pojmy": [{"q": "Co je chemický prvek?", "a": "Látka tvořená atomy se stejným protonovým číslem (nelze rozložit chemickými metodami); např. železo, kyslík, uhlík"}, {"q": "Co je sloučenina?", "a": "Chemicky čistá látka tvořená atomy dvou nebo více různých prvků v pevném poměru; lze rozložit chemickými metodami"}, {"q": "Co je atom?", "a": "Nejmenší elektricky neutrální částice prvku; skládá se z jádra (protony + neutrony) a elektronového obalu"}, {"q": "Co je protonové číslo (Z)?", "a": "Počet protonů v jádře atomu; určuje totožnost prvku a jeho místo v periodické tabulce"}, {"q": "Co je nukleonové číslo (A)?", "a": "Celkový počet nukleonů (protonů + neutronů) v jádře atomu; A = Z + N"}, {"q": "Co je molekula?", "a": "Nejmenší částice látky zachovávající její chemické vlastnosti; tvořena dvěma nebo více atomy spojenými chemickými vazbami"}, {"q": "Co je ion?", "a": "Elektricky nabitá částice vzniklá ztrátou nebo ziskem elektronů z atomu nebo skupiny atomů"}, {"q": "Co je kation?", "a": "Kladně nabitý ion; vzniká ztrátou elektronu(ů) z atomu nebo skupiny atomů"}, {"q": "Co je anion?", "a": "Záporně nabitý ion; vzniká přijetím elektronu(ů) atomem nebo skupinou atomů"}, {"q": "Co je chemicky čistá látka?", "a": "Látka tvořená jediným druhem atomů (prvek) nebo jediným druhem molekul (sloučenina); má stálé fyzikální vlastnosti"}, {"q": "Co je homogenní směs?", "a": "Směs, v níž jsou složky rozptýleny rovnoměrně na molekulární úrovni; nelze rozlišit složky pouhým okem (např. vzduch, roztoky)"}, {"q": "Co je heterogenní směs?", "a": "Směs, v níž jsou složky rozlišitelné; nejsou rovnoměrně promíchány na molekulární úrovni (např. písek ve vodě, mlhovina)"}], "Metody dělení směsí": [{"q": "Co je filtrace?", "a": "Oddělení pevné látky od kapaliny (nebo plynu) pomocí filtru; odděluje složky různé velikosti částic"}, {"q": "Co je destilace?", "a": "Oddělení kapalin s různými body varu postupným odpařováním a kondenzací; využívá rozdílnou těkavost složek"}, {"q": "Co je krystalizace?", "a": "Oddělení pevné rozpuštěné látky z roztoku ochlazením nebo odpařením rozpouštědla; výsledkem jsou krystaly čisté látky"}, {"q": "Co je sublimace?", "a": "Přímá přeměna pevné látky v plyn (bez kapalné fáze) a zpětná kondenzace; využívá se k čištění látek (jód, kafr)"}], "Kvantitativní chemie": [{"q": "Co je látkové množství (n)?", "a": "Fyzikální veličina vyjadřující množství látky; jednotka je mol; 1 mol = 6,022 × 10²³ částic (Avogadrova konstanta)"}, {"q": "Co je Avogadrova konstanta (Nₐ)?", "a": "Počet částic (atomů, molekul, iontů) v jednom molu látky; Nₐ ≈ 6,022 × 10²³ mol⁻¹"}, {"q": "Co je molární hmotnost (M)?", "a": "Hmotnost jednoho molu látky; vyjadřuje se v g/mol; číselně se rovná relativní atomové nebo molekulové hmotnosti"}, {"q": "Co je molární objem (Vₘ)?", "a": "Objem jednoho molu plynu za standardních podmínek (STP: 0 °C, 101,325 kPa); Vₘ ≈ 22,4 l/mol"}, {"q": "Co je hmotnostní zlomek (w)?", "a": "Podíl hmotnosti složky a celkové hmotnosti směsi; w = m_složky / m_celkové; bezrozměrná veličina (0–1 nebo 0–100 %)"}, {"q": "Co je objemový zlomek (φ)?", "a": "Podíl objemu složky a celkového objemu směsi; φ = V_složky / V_celkové; používá se zejména u plynů a kapalin"}, {"q": "Co je molární koncentrace (c)?", "a": "Látkové množství rozpuštěné látky v 1 litru roztoku; c = n/V; jednotka mol/l (mol·l⁻¹)"}], "Modely atomu a radioaktivita": [{"q": "Co je Thomsonův model atomu?", "a": "'Pudinukový model' (1904) – kladný náboj rozložen rovnoměrně v kulovém atomu, elektrony jsou v něm rozmístěny jako rozinky"}, {"q": "Co je Rutherfordův model atomu?", "a": "Model (1911) s malým hustým kladně nabitým jádrem uprostřed a elektrony pohybujícími se kolem jádra v prázdném prostoru"}, {"q": "Co je Bohrův model atomu?", "a": "Model (1913) s elektrony pohybujícími se po přesně daných stacionárních kruhových drahách (orbitalech); každá dráha má pevnou energii"}, {"q": "Co je nuklid?", "a": "Atom s určitým počtem protonů a neutronů; definován protonovým číslem Z a nukleonovým číslem A; nuklidy téhož prvku = izotopy"}, {"q": "Co je izotop?", "a": "Atomy téhož prvku (stejné Z) s různým počtem neutronů (různé A); mají stejné chemické vlastnosti, různé fyzikální"}, {"q": "Co je radioaktivita?", "a": "Samovolný rozpad nestabilních jader atomů za emise ionizujícího záření (α, β nebo γ)"}, {"q": "Co je přirozená radioaktivita?", "a": "Spontánní rozpad přirozeně se vyskytujících nestabilních jader; např. U-238, Ra-226, C-14"}, {"q": "Co je umělá radioaktivita?", "a": "Radioaktivita vyvolána uměle – bombardováním stabilních jader vysokoenergetickými částicemi v urychlovačích"}, {"q": "Co je alfa záření?", "a": "Proud alfa částic (jader helia ⁴He, tj. 2 protony + 2 neutrony); malý dosah, velká ionizační schopnost, stínění papírem"}, {"q": "Co je beta záření?", "a": "Proud elektronů (β⁻) nebo pozitronů (β⁺) vznikajících při přeměně neutronu/protonu v jádře; střední dosah, stínění hliníkem"}, {"q": "Co je gama záření?", "a": "Elektromagnetické záření vysoké energie (krátká vlnová délka); velký dosah, velká průnikavost, stínění olovem nebo betonem"}, {"q": "Co je štěpení jader?", "a": "Rozdělení těžkého jádra (U-235, Pu-239) na dvě lehčí jádra s uvolněním energie a neutronů; základní princip jaderné energie"}], "Kvantová čísla a orbitaly": [{"q": "Co je atomový orbital?", "a": "Oblast prostoru kolem jádra, v níž je největší pravděpodobnost výskytu elektronu; popsán vlnovou funkcí"}, {"q": "Jaký je tvar orbitalu s?", "a": "Kulový (sféricky symetrický); v každé vrstvě je jeden s-orbital"}, {"q": "Jaký je tvar orbitalu p?", "a": "Dvojlaločný (činkový, zkos); ve vrstvě jsou tři navzájem kolmé p-orbitaly (px, py, pz)"}, {"q": "Co určuje hlavní kvantové číslo (n)?", "a": "Energetickou vrstvu (hladinu) elektronu a průměrnou vzdálenost od jádra; n = 1, 2, 3, … (K, L, M, …)"}, {"q": "Co určuje vedlejší kvantové číslo (l)?", "a": "Tvar (druh) orbitalu; l = 0, 1, 2, … (n-1); odpovídá podvrstvám s, p, d, f"}, {"q": "Co určuje magnetické kvantové číslo (m)?", "a": "Prostorovou orientaci orbitalu; m = -l … 0 … +l"}, {"q": "Co vyjadřuje spinové číslo (s)?", "a": "Vnitřní moment hybnosti elektronu (spin); s = +½ nebo -½ (spin 'nahoru' nebo 'dolů')"}, {"q": "Co říká Pauliho vylučovací princip?", "a": "V jednom orbitalu mohou být nejvýše 2 elektrony, a to s opačnými spiny"}, {"q": "Co říká Hundovo pravidlo?", "a": "Elektrony obsazují nejprve volné orbitaly téže podvrstvy každý zvlášť (se stejným spinem) a teprve pak se párují"}], "Chemické vazby": [{"q": "Co je chemická vazba?", "a": "Síla poutající atomy v molekulách nebo iontech; vzniká sdílením nebo přenosem elektronů"}, {"q": "Co je délka vazby?", "a": "Rovnovážná vzdálenost mezi jádry vázaných atomů; kratší dvojné/trojné vazby jsou pevnější než jednoduchá"}, {"q": "Co je energie vazby?", "a": "Energie potřebná k roztržení (homolytickému štěpení) jednoho molu daných vazeb; udává pevnost vazby"}, {"q": "Co je jednoduchá vazba (σ)?", "a": "Vazba tvořená jedním sdíleným elektronovým párem; nejčastější; rotace kolem vazby je volná"}, {"q": "Co je dvojná vazba?", "a": "Vazba tvořená dvěma sdílenými elektronovými páry (jedna σ + jedna π); kratší a pevnější než jednoduchá"}, {"q": "Co je trojná vazba?", "a": "Vazba tvořená třemi sdílenými páry (jedna σ + dvě π); nejkratší a nejpevnější; typická pro alkyny a N₂"}, {"q": "Co je kovalentní vazba?", "a": "Vazba sdílením elektronového páru mezi dvěma atomy; může být nepolární (stejné prvky) nebo polární (různé elektro-negativity)"}, {"q": "Co je kovová vazba?", "a": "Vazba v kovech – kationty kovu obklopeny 'mořem' delokalizovaných elektronů; vysvětluje vodivost a kujnost kovů"}, {"q": "Co je vodíkový můstek?", "a": "Mezimolekulová (nebo intramolekulová) přitažlivá síla mezi H vázaným na elektronegativní atom (N, O, F) a dalším takovým atomem"}, {"q": "Co jsou Van der Waalsovy síly?", "a": "Slabé mezimolekulové přitažlivé síly (disperzní, dipól-dipól); působí na krátkou vzdálenost; odpovídají za kondenzaci plynů"}], "Chemické reakce": [{"q": "Co jsou reaktanty?", "a": "Výchozí látky vstupující do chemické reakce; na levé straně chemické rovnice"}, {"q": "Co jsou produkty?", "a": "Látky vznikající při chemické reakci; na pravé straně chemické rovnice"}, {"q": "Co je chemická rovnice?", "a": "Symbolický zápis chemické reakce pomocí vzorců reaktantů a produktů; musí být vyčíslena (zákon zachování hmotnosti)"}, {"q": "Co je syntéza (slučovací reakce)?", "a": "Reakce, při níž dvě nebo více jednodušších látek poskytnou jednu složitější; A + B → AB"}, {"q": "Co je analýza (rozkladná reakce)?", "a": "Reakce, při níž jedna složitá látka se rozloží na dvě nebo více jednodušších látek; AB → A + B"}, {"q": "Co je adice?", "a": "Přičítání atomů nebo skupin k násobné vazbě; π-vazba se otevírá a přijímá nové atomy"}, {"q": "Co je eliminace?", "a": "Odštěpení malé molekuly (H₂O, HX) ze substrátu za vzniku násobné vazby; opak adice"}, {"q": "Co je substituce?", "a": "Nahrazení atomu nebo skupiny v molekule jiným atomem nebo skupinou"}], "Rychlost reakcí a rovnováha": [{"q": "Co říká srážková teorie?", "a": "Reakce nastane, když se reaktanty srazí se správnou orientací a s dostatečnou energií (≥ aktivační energie)"}, {"q": "Co je aktivovaný komplex (přechodný stav)?", "a": "Nestabilní uspořádání atomů v okamžiku, kdy se tvoří i trhají vazby; odpovídá maximu energetického profilu reakce"}, {"q": "Co je rychlost chemické reakce?", "a": "Změna koncentrace reaktantů nebo produktů za jednotku času; závisí na teplotě, koncentraci, katalyzátoru a povrchu"}, {"q": "Co je katalyzátor?", "a": "Látka urychlující chemickou reakci tím, že snižuje aktivační energii; sama se reakcí nespotřebovává"}, {"q": "Co je exotermická reakce?", "a": "Reakce, při níž se uvolňuje teplo (∆H < 0); produkty mají nižší entalpii než reaktanty; např. hoření"}, {"q": "Co je endotermická reakce?", "a": "Reakce, při níž se teplo spotřebovává (∆H > 0); produkty mají vyšší entalpii než reaktanty; např. rozklad CaCO₃"}, {"q": "Co je chemická rovnováha?", "a": "Stav, kdy přímá a zpětná reakce probíhají stejnou rychlostí; koncentrace reaktantů a produktů jsou konstantní"}, {"q": "Co je rovnovážná konstanta (K)?", "a": "Poměr součinu rovnovážných koncentrací produktů k součinu koncentrací reaktantů (v mocninách stechiometrických koeficientů)"}], "Redoxní reakce": [{"q": "Co je oxidace?", "a": "Ztráta elektronů (nebo zvýšení oxidačního čísla); oxidovaná látka je redukovadlo"}, {"q": "Co je redukce?", "a": "Přijetí elektronů (nebo snížení oxidačního čísla); redukovaná látka je oxidovadlo"}, {"q": "Co je redoxní reakce (oxidačně-redukční)?", "a": "Reakce, při níž dochází k přenosu elektronů; oxidace a redukce probíhají vždy současně"}, {"q": "Co je Beketovova (aktivitní) řada kovů?", "a": "Řada kovů seřazených podle jejich schopnosti vytěsňovat jiné kovy z roztoků solí; aktivnější kovy vytěsňují méně aktivní"}], "Kyseliny a zásady": [{"q": "Co je kyselina podle Brønsteda?", "a": "Látka (donor protonů H⁺), která může proton odevzdat zásadě; např. HCl, H₂SO₄, CH₃COOH"}, {"q": "Co je zásada podle Brønsteda?", "a": "Látka (akceptor protonů H⁺), která může proton přijmout od kyseliny; např. NaOH, NH₃, H₂O"}, {"q": "Co je konjugovaný pár kyselina-zásada?", "a": "Kyselina a odpovídající zásada, která vznikne po odtržení protonu; liší se o jeden H⁺ (např. HCl a Cl⁻, NH₄⁺ a NH₃)"}, {"q": "Co je pH?", "a": "Záporný dekadický logaritmus koncentrace oxoniových iontů H₃O⁺; pH = -log[H₃O⁺]; škála 0–14 (7 je neutrální)"}, {"q": "Jaké je pH silné kyseliny?", "a": "pH silné kyseliny je výrazně pod 7 (např. 1 mol/l HCl má pH ≈ 0); silné kyseliny se v vodě úplně disociují"}, {"q": "Jaké je pH silné zásady?", "a": "pH silné zásady je výrazně nad 7 (např. 1 mol/l NaOH má pH ≈ 14); silné zásady se ve vodě úplně disociují"}], "Periodická tabulka": [{"q": "Co říká periodický zákon?", "a": "Fyzikální a chemické vlastnosti prvků jsou periodickou funkcí jejich protonového čísla (počtu protonů v jádře)"}, {"q": "Co je perioda v periodické tabulce?", "a": "Vodorovná řada prvků se stejným počtem elektronových vrstev (hladin); číslo periody = počet vrstev"}, {"q": "Co je skupina v periodické tabulce?", "a": "Svislý sloupec prvků se stejnou elektronovou konfigurací valenční vrstvy; prvky skupiny mají podobné chemické vlastnosti"}], "Vodík a kyslík": [{"q": "Jaké jsou vlastnosti, využití a výskyt vodíku?", "a": "Nejlehčí plyn, hořlavý, bez barvy a zápachu; výskyt: voda, organické látky; využití: syntéza amoniaku (Haber), raketová paliva, hydrogenace, palivové články"}, {"q": "Jaké jsou sloučeniny vodíku?", "a": "Voda (H₂O), sirovodík (H₂S), halogenidy (HCl, HF…), amoniak (NH₃), silany; vodík tvoří hydráty s kovy"}, {"q": "Jaké jsou vlastnosti, využití a výskyt kyslíku?", "a": "Bezbarvý plyn bez zápachu, tvoří 21 % atmosféry; nejrozšířenější prvek v zemské kůře; využití: hoření, výroba oceli, medicína (dýchání), výroba kyseliny sírové"}], "Alkalické kovy a kovy alkalických zemin": [{"q": "Jaké jsou vlastnosti, využití a výskyt alkalických kovů?", "a": "1. skupina (Li, Na, K, Rb, Cs, Fr); měkké, lehké, reaktivní kovy; silná reaktivita s vodou (H₂ + hydroxid); výskyt jako soli; využití: NaOH, Na v reaktorech, Li v bateriích"}, {"q": "Jaké jsou sloučeniny Na a K?", "a": "NaCl (kuchyňská sůl), NaOH (louh sodný), Na₂CO₃ (soda), NaHCO₃ (jedlá soda), KNO₃ (ledek draselný), KOH, K₂SO₄ (hnojivo)"}, {"q": "Jaké jsou vlastnosti, využití a výskyt kovů alkalických zemin?", "a": "2. skupina (Be, Mg, Ca, Sr, Ba, Ra); tvrdší a méně reaktivní než alkalické kovy; výskyt jako karbonáty a sírany; Ca tvoří vápno a sádru"}, {"q": "Jaké jsou vlastnosti, využití a výskyt vápníku (Ca)?", "a": "Stříbřitě bílý kov; výskyt: CaCO₃ (vápenec, mramor), CaSO₄ (sádrovec), Ca₃(PO₄)₂ (fosforit); využití: stavebnictví (vápno, cement, sádra), výroba skla, hnojiva"}]};

  let mode = 'p';

  function setMode(m) {
    mode = m;
    document.getElementById('mbP').classList.toggle('active', m==='p');
    document.getElementById('mbO').classList.toggle('active', m==='o');
    document.getElementById('aP').style.display = m==='p' ? '' : 'none';
    document.getElementById('aO').style.display = m==='o' ? '' : 'none';

      ? '📄 <strong>Papírová verze:</strong> Testy k tisku, studenti píší rukou.'

      ? '💡 Každý student dostane jiné otázky (proporcionálně z vybraných okruhů).'
      : '💡 Po odevzdání se automaticky otevře hodnotící soubor v novém okně. Student ho uloží (Ctrl+S) a nahraje na disk W:// do určeného adresáře.';

  }

  function getSections() {
    return Array.from(document.querySelectorAll('.cc')).filter(c=>c.checked).map(c=>c.value);
  }
  function setAll(v) { document.querySelectorAll('.cc').forEach(c=>c.checked=v); }

  function validate() {
    const cls=document.getElementById('cls').value;
    const qc=parseInt(document.getElementById('qc').value)||0;
    const secs=getSections();
    if (!cls) { showWarn('Vyber třídu.'); return null; }
    if (!secs.length) { showWarn('Vyber alespoň jeden okruh.'); return null; }
    if (qc<1) { showWarn('Zadej počet otázek.'); return null; }
    hideWarn();
    const pin=parseInt(document.getElementById('pin').value)||1234;
    const tmin=parseInt(document.getElementById('tmin').value)||15;
    return {cls, sc:parseInt(document.getElementById('sc').value)||2, td:document.getElementById('td').value, qc, secs, pin, tmin};
  }

  function showWarn(m) { document.getElementById('warnBox').textContent=m; document.getElementById('warnBox').style.display=''; }
  function hideWarn() { document.getElementById('warnBox').style.display='none'; }

  function shuffle(arr) {
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  }
  function genTest(qc, secs) {
    const tot=secs.reduce((s,sec)=>s+(questionsDatabase[sec]?.length||0),0);
    let sel=[];
    secs.forEach(sec=>{
      const pool=shuffle([...questionsDatabase[sec]]);
      const cnt=Math.round(qc*pool.length/tot);
      pool.slice(0,Math.min(cnt,pool.length)).forEach(q=>sel.push({...q,section:sec}));
    });
    sel=sel.slice(0,qc);
    shuffle(sel);
    return sel;
  }

  function dlFile(content, name, type) {
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function genPrint() {
    const p=validate(); if(!p) return;
    const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const sn=p.secs.join(', ');
    let c=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@media print{.tp{page-break-after:always}.tp:last-child{page-break-after:auto}}
@media screen{.tp{border-bottom:3px solid #999;margin-bottom:30px;padding-bottom:20px}}

.hd p{margin:1.5px 0;font-size:9pt}
.q{border-bottom:1px solid #ddd;padding:2px 0;page-break-inside:avoid}
.qt{font-weight:bold;font-size:9pt}
.af{min-height:3em;padding:2px 3px}

.sum{border:1.5px solid black;padding:8px;margin:8px 0}
</style></head><body>`;
    for(let i=0;i<p.sc;i++) {
      if(i>0) c+='<br clear=all style="page-break-before:always">';
      const qs=genTest(p.qc,p.secs);
      c+=`<h1>TEST — CHEMIE — 1. ROČNÍK</h1>
<div class="hd">
  <p><strong>Jméno a příjmení:</strong> ___________________________</p>
  <p><strong>Třída:</strong> ${p.cls} &nbsp; <strong>Datum:</strong> ${p.td} &nbsp; <strong>Varianta:</strong> ${L[i]||i+1}</p>
  <p style="font-size:8pt;color:#555"><strong>Okruhy:</strong> ${sn.length>90?sn.slice(0,90)+'…':sn}</p>
</div>`;
      qs.forEach((q,j)=>{c+=`<div class="q"><p class="qt">${j+1}. ${q.q}</p><div class="af">&nbsp;</div><p class="pts">Bodů: _____</p></div>`;});
      c+=`<div class="sum"><h2>HODNOCENÍ</h2><br><p><strong>Celkem bodů:</strong> __________ / ${p.qc}</p><br><p><strong>Známka:</strong> ________________</p></div>`;
    }
    c+='</body></html>';
    dlFile(c, `testy_chemie_1rocnik_${p.cls}_${p.td}.doc`, 'application/msword');
    document.getElementById('okTxt') && (document.getElementById('okBox').innerHTML='<strong>✅ Hotovo!</strong> ' + p.sc + ' testů pro třídu ' + p.cls);
    document.getElementById('okBox').style.display='';
  }

  function genOnline() {
    const p=validate(); if(!p) return;
    const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const variants=[];
    for(let i=0;i<p.sc;i++) variants.push(genTest(p.qc,p.secs));
    const varJSON=JSON.stringify(variants);
    const varOpts=Array.from({length:p.sc},(_,i)=>`<option value="${i}">Varianta ${L[i]||i+1}</option>`).join('');

    const onlineHTML = buildOnlineHTML(p, varJSON, varOpts, L);
    dlFile(onlineHTML, `test_ONLINE_chemie_1rocnik_${p.cls}_${p.td}.html`, 'text/html');
    document.getElementById('okBox').innerHTML='<strong>✅ Online test vygenerován!</strong><br>'
      +'<small>Sdílej soubor studentům. Po vyplnění student nahraje hodnotící soubor do Classroom.</small><br>'
      +'<strong style="color:#6366f1">🔒 PIN pro hodnocení: ' + p.pin + '</strong> (zapiš si ho!)';
    document.getElementById('okBox').style.display='';
  }

const allV=${varJSON};

const PIN=${p.pin};
let cv=null,sN='',sVar='',curAns=[];

function startTest(){
  const ne=document.getElementById('sName'),ve=document.getElementById('vSel');
  sN=ne.value.trim();const vi=parseInt(ve.value);
  const err=document.getElementById('selErr');
  if(!sN){err.textContent='Zadej prosím své jméno.';err.style.display='block';ne.focus();return;}
  if(isNaN(vi)){err.textContent='Vyber variantu.';err.style.display='block';return;}
  err.style.display='none';
  cv=allV[vi];
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';sVar='Varianta '+(L[vi]||vi+1);
  document.getElementById('tMeta').textContent=sN+' | '+sVar+' | ${p.cls} | ${p.td}';
  renderTest();
  document.getElementById('scSel').style.display='none';
  document.getElementById('scTest').style.display='block';startTimer();
  window.scrollTo(0,0);
}

function renderTest(){
  const b=document.getElementById('tBod');b.innerHTML='';
  cv.forEach((item,i)=>{
    const d=document.createElement('div');d.className='qC';d.id='qc'+i;
    d.innerHTML='<div class="qH"><span class="qN">Otázka '+(i+1)+' / ${p.qc}</span><span class="qS">'+item.section+'</span></div>'
      +'<div class="qT">'+item.q+'</div>'
      +'<textarea class="qTA" id="a'+i+'" placeholder="Napiš svou odpověď..." oninput="upd()"></textarea>'
      +'<div class="qF"><span class="pb">max 2 body</span></div>';
    b.appendChild(d);
  });upd();
}

function upd(){
  let f=0;
  cv.forEach((_,i)=>{
    const e=document.getElementById('a'+i),c=document.getElementById('qc'+i);
    if(e&&e.value.trim()){f++;if(c)c.className='qC done';}else{if(c)c.className='qC';}
  });
  document.getElementById('pF').style.width=Math.round(f/cv.length*100)+'%';
}


  var timerInterval=null;
  function startTimer(){
    var total=TMIN*60;
    var remaining=total;
    function tick(){
      remaining--;
      if(remaining<0){clearInterval(timerInterval);submitTest();return;}
      var m=Math.floor(remaining/60);
      var s=remaining%60;
      var txt=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
      var pct=Math.round(remaining/total*100);
      var isRed=remaining<120;
      var fill=document.getElementById('tmrFill');
      var tmrTxt=document.getElementById('tmrTxt');
      if(fill){fill.style.width=pct+'%';fill.className='tmr-fill'+(isRed?' red':'');}
      if(tmrTxt){tmrTxt.textContent=txt;tmrTxt.className='tmr-txt'+(isRed?' red':'');}
    }
    tick();
    timerInterval=setInterval(tick,1000);
  }
function submitTest(){
  if(timerInterval)clearInterval(timerInterval);
  curAns=cv.map((item,i)=>{
    return{q:item.q,sec:item.section,sA:(document.getElementById('a'+i)||{value:''}).value.trim(),cA:item.a};
  });
  document.getElementById('dName').textContent=sN;
  document.getElementById('dVar').textContent=sVar;
  document.getElementById('scTest').style.display='none';
  document.getElementById('scDone').style.display='flex';
  window.scrollTo(0,0);
  openTeacherFile();
}
