<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generátor — BIOLOGIE — 3. ročník</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#dc2626,#b91c1c);padding:24px;min-height:100vh}
    .container{max-width:820px;margin:0 auto}
    .card{background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:32px;margin-bottom:24px}
    h1{font-size:24px;font-weight:700;color:#1f2937;margin-bottom:20px;text-align:center}
    h2{font-size:15px;font-weight:600;color:#374151;margin-bottom:10px}
    .info{background:#eff6ff;border-radius:8px;padding:13px 16px;margin-bottom:18px;font-size:13px;color:#374151;line-height:1.6}
    .fg{margin-bottom:13px}
    .fg label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
    input,select{width:100%;padding:9px 12px;border:2px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;background:white}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .msw{display:flex;border:2px solid #d1d5db;border-radius:10px;overflow:hidden;margin-bottom:14px}
    .mb{flex:1;padding:11px;background:white;border:none;cursor:pointer;font-size:14px;font-weight:500;color:#6b7280}
    .mb.active{background:linear-gradient(to right,#dc2626,#b91c1c);color:white}
    .mi{background:#f9fafb;border:2px solid #e5e7eb;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#374151}
    .cbox{border:2px solid #e5e7eb;border-radius:12px;padding:15px;margin-bottom:18px}
    .chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:8px}
    .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px}
    .ci{border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 10px}
    .ci:has(.cc:checked){border-color:#dc2626;background:#eff6ff}
    .cl{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
    .cl input{width:14px;height:14px;accent-color:#dc2626;flex-shrink:0}
    .cn{flex:1;color:#374151;font-weight:500}
    .cb{background:#e5e7eb;color:#6b7280;font-size:11px;padding:1px 7px;border-radius:20px}
    .ci:has(.cc:checked) .cb{background:#dc2626;color:white}
    .cbtn{padding:5px 11px;border-radius:6px;border:1.5px solid #d1d5db;background:white;cursor:pointer;font-size:12px;font-weight:600;color:#374151}
    .btn{padding:13px;border-radius:8px;font-weight:600;border:none;cursor:pointer;font-size:15px;width:100%;margin-top:7px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
    .bp{background:linear-gradient(to right,#dc2626,#b91c1c);color:white}
    .bo{background:linear-gradient(to right,#10b981,#059669);color:white}
    .bs{background:linear-gradient(to right,#6b7280,#4b5563);color:white;margin-top:13px}
    .warn{background:#fef3c7;border:2px solid #fbbf24;border-radius:8px;padding:11px;margin-top:12px;display:none;text-align:center;font-size:13px;color:#92400e}
    .ok{background:#d1fae5;border:2px solid #10b981;border-radius:8px;padding:13px;margin:12px 0;display:none;font-size:13px;color:#065f46}
    .tip{background:#dbeafe;border-radius:8px;padding:13px;margin-top:18px;font-size:13px;color:#1e40af;line-height:1.5}
  </style>
</head>
<body>
<div class="container"><div class="card">
  <h1>🧬 Generátor testů — BIOLOGIE — 3. ročník</h1>

  <div class="msw">
    <button class="mb active" id="mbP" onclick="setMode('p')">📄 Papírová verze</button>
    <button class="mb" id="mbO" onclick="setMode('o')">💻 Online verze</button>
  </div>
  <div class="mi" id="mInfo">📄 <strong>Papírová verze:</strong> Testy k tisku, studenti píší rukou.</div>

  <div class="info" id="infoBox"></div>

  <div class="fg"><label>Třída:</label>
    <select id="cls"><option value="">-- Vyber třídu --</option><option value="3.A">3.A</option>
<option value="3.B">3.B</option>
<option value="7SA">7SA</option></select>
  </div>
  <div class="row">
    <div class="fg"><label>Počet studentů / variant:</label><input type="number" id="sc" value="2" min="1" max="50"></div>

    <div class="fg"><label>Datum testu:</label><input type="date" id="td"></div>
  </div>
  <div class="row">
    <div class="fg"><label>Otázek na test:</label><input type="number" id="qc" value="20" min="1" max="60"></div>
    <div class="fg">
      <label>&#128274; PIN pro učitele (zapiš si ho!):</label>
      <input type="number" id="pin" value="1234" min="1000" max="9999" placeholder="4 číslice"
        style="font-size:20px;font-weight:700;letter-spacing:4px;color:#6366f1;border-color:#6366f1"
        oninput="document.getElementById('pinShow').textContent=this.value">
      <div style="font-size:13px;color:#6b7280;margin-top:5px">
        Učitel zadá tento PIN při hodnocení: <strong id="pinShow" style="color:#6366f1;font-size:16px">1234</strong>
      </div>
    </div>
  </div>

  <div class="cbox">
    <div class="chdr">
      <h2>📚 Tematické okruhy</h2>
      <div style="display:flex;gap:7px">
        <button class="cbtn" onclick="setAll(true)">✅ Vše</button>
        <button class="cbtn" onclick="setAll(false)">❌ Zrušit</button>
      </div>
    </div>
    <div class="cgrid">
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Opěrná soustava" checked>
          <span class="cn">Opěrná soustava</span><span class="cb">16 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Svalová soustava" checked>
          <span class="cn">Svalová soustava</span><span class="cb">15 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Krevní a lymfatická soustava" checked>
          <span class="cn">Krevní a lymfatická soustava</span><span class="cb">17 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Oběhová soustava" checked>
          <span class="cn">Oběhová soustava</span><span class="cb">13 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Trávicí soustava" checked>
          <span class="cn">Trávicí soustava</span><span class="cb">16 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Vylučovací soustava" checked>
          <span class="cn">Vylučovací soustava</span><span class="cb">9 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Smyslová soustava" checked>
          <span class="cn">Smyslová soustava</span><span class="cb">13 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Pohlavní rozmnožování a vývin" checked>
          <span class="cn">Pohlavní rozmnožování a vývin</span><span class="cb">17 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Endokrinní soustava" checked>
          <span class="cn">Endokrinní soustava</span><span class="cb">15 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Nervová soustava" checked>
          <span class="cn">Nervová soustava</span><span class="cb">16 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Genetika" checked>
          <span class="cn">Genetika</span><span class="cb">15 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Ekologie" checked>
          <span class="cn">Ekologie</span><span class="cb">50 ot.</span>
        </label></div></div>
  </div>

  <div id="aP"><button class="btn bp" onclick="genPrint()">📄 Vygenerovat testy k tisku</button></div>
  <div id="aO" style="display:none"><button class="btn bo" onclick="genOnline()">💻 Vygenerovat online test</button></div>

  <button class="btn bs" onclick="location.href='dexin.html'">← Zpět na rozcestník</button>

  <div class="warn" id="warnBox"></div>
  <div class="ok" id="okBox"></div>
  <div class="tip" id="tipBox">💡 Vyber tematické okruhy, nastav parametry a vygeneruj.</div>
</div></div>

<script>
  const questionsDatabase = {"Opěrná soustava": [{"q": "Co je opěrná soustava?", "a": "Soustava kostí, chrupavek a vazů, která tvoří oporu těla, chrání vnitřní orgány a umožňuje pohyb."}, {"q": "Co je skelet?", "a": "Kostra – soubor všech kostí těla."}, {"q": "Co je kloub?", "a": "Pohyblivé spojení dvou nebo více kostí umožňující pohyb v určitém rozsahu."}, {"q": "Co je kloubní chrupavka?", "a": "Hladká vrstva chrupavky pokrývající kloubní plochy kostí, snižuje tření."}, {"q": "Co jsou vazy?", "a": "Pevná vazivová vlákna spojující kosti a stabilizující klouby."}, {"q": "Co jsou šlachy?", "a": "Pevná vazivová vlákna spojující svaly s kostmi."}, {"q": "Co je lebka?", "a": "Kostěná schránka chránící mozek (mozková část) a tvořící kostru obličeje (obličejová část)."}, {"q": "Co je páteř?", "a": "Sloup 33–34 obratlů tvořící osu těla, chrání míchu a umožňuje vzpřímenou polohu."}, {"q": "Co je obratel?", "a": "Kostěná jednotka páteře tvořená tělem, obloukem a výběžky."}, {"q": "Co je páteřní kanál?", "a": "Kanál vzniklý oblouky obratlů, jímž prochází mícha."}, {"q": "Co jsou meziobratlové ploténky?", "a": "Chrupavčité destičky mezi obratli tlumící nárazy a umožňující pohyb páteře."}, {"q": "Co je hrudník?", "a": "Kostra tvořená hrudní kostí, žebry a hrudními obratli, chránící srdce a plíce."}, {"q": "Co je kostní dřeň?", "a": "Tkáň uvnitř kostí – červená produkuje krvinky, žlutá je tukové zásobárna."}, {"q": "Co je krvetvorba (hemopoeza)?", "a": "Tvorba krvinek v červené kostní dřeni (erytrocytů, leukocytů, trombocytů)."}, {"q": "Z čeho se skládá horní končetina?", "a": "Z ramenního pletence, paže (pažní kost), předloktí (vřetenní a loketní kost) a ruky (zápěstí, záprstí, články prstů)."}, {"q": "Z čeho se skládá dolní končetina?", "a": "Z pánevního pletence, stehna (stehenní kost), bérce (holenní a lýtková kost) a nohy (nárt, nárt, články prstů)."}], "Svalová soustava": [{"q": "Co je svalová tkáň?", "a": "Tkáň schopná stahu (kontrakce), tvoří svaly."}, {"q": "Co je příčně pruhované svalstvo?", "a": "Kosterní svalstvo ovládané vůlí, pod mikroskopem viditelné příčné pruhování."}, {"q": "Co je srdeční svalstvo?", "a": "Zvláštní typ příčně pruhovaného svalu tvořící stěnu srdce, pracující mimovolně."}, {"q": "Co je hladké svalstvo?", "a": "Mimovolně pracující svalstvo ve stěnách vnitřních orgánů (střeva, cévy)."}, {"q": "Co je sval?", "a": "Orgán tvořený svalovými vlákny schopný kontrakce a relaxace."}, {"q": "Co je svalové vlákno?", "a": "Základní stavební jednotka svalu – elongovaná mnohojaderná buňka."}, {"q": "Co jsou myofibrily?", "a": "Kontraktilní vlákna uvnitř svalových vláken tvořená aktinem a myosinem."}, {"q": "Co je nervosvalová ploténka?", "a": "Synapse mezi motorickým neuronem a svalovým vláknem, přenáší nervový impuls ke svalu."}, {"q": "Co je synergista?", "a": "Sval spolupracující s jiným svalem na stejném pohybu."}, {"q": "Co je antagonista?", "a": "Sval působící proti jinému svalu – vykonává opačný pohyb."}, {"q": "Co je flexor?", "a": "Sval ohybač – provádí ohnutí (flexi) v kloubu."}, {"q": "Co je extenzor?", "a": "Sval natahovač – provádí natažení (extenzi) v kloubu."}, {"q": "Uveď příklady svalů horní končetiny.", "a": "Biceps, triceps, deltový sval."}, {"q": "Uveď příklady svalů dolní končetiny.", "a": "Čtyřhlavý sval stehenní (quadriceps), dvojhlavý sval stehenní, lýtkový sval."}, {"q": "Uveď příklady svalů hlavy a trupu.", "a": "Žvýkací svaly, trapézový sval, přímý sval břišní."}], "Krevní a lymfatická soustava": [{"q": "Co je homeostáza?", "a": "Udržování stálého vnitřního prostředí organismu (teploty, pH, složení krve)."}, {"q": "Co je krev?", "a": "Tekutá pojivová tkáň složená z krevní plazmy a krevních elementů (erytrocytů, leukocytů, trombocytů)."}, {"q": "Co je lymfa?", "a": "Čirá tekutina v lymfatických cévách odvádějící tkáňový mok zpět do krve."}, {"q": "Co je hematologie?", "a": "Lékařský obor zabývající se krví a krevními chorobami."}, {"q": "Co je glykemie?", "a": "Hladina glukózy v krvi (normálně 3,9–5,6 mmol/l nalačno)."}, {"q": "Co je krevní obraz?", "a": "Laboratorní vyšetření počtu a vlastností krvinek."}, {"q": "Co jsou erytrocyty?", "a": "Červené krvinky přenášející kyslík pomocí hemoglobinu."}, {"q": "Co jsou leukocyty?", "a": "Bílé krvinky zajišťující obranu organismu proti infekcím a cizorodým látkám."}, {"q": "Co jsou trombocyty?", "a": "Krevní destičky účastnící se srážení krve (zástavy krvácení)."}, {"q": "Co je hemoglobin?", "a": "Červený krevní barvivo v erytrocytech přenášející kyslík a oxid uhličitý."}, {"q": "Co je hematokrit?", "a": "Podíl objemu krvinek na celkovém objemu krve (normálně 40–50 %)."}, {"q": "Co je sedimentace?", "a": "Rychlost klesání erytrocytů v klidu – zvýšená hodnota signalizuje zánět."}, {"q": "Co je diapedéza?", "a": "Prostup leukocytů stěnou kapilár do tkání při zánětu."}, {"q": "Co je hemostáze?", "a": "Proces zástavy krvácení – stah cévy, tvorba destičkové zátky a krevní sraženiny."}, {"q": "Co je embolie?", "a": "Ucpání cévy embolem (krevní sraženinou, bublinkou plynu nebo tukem)."}, {"q": "Co je anémie?", "a": "Chudokrevnost – snížený počet erytrocytů nebo množství hemoglobinu."}, {"q": "Co je leukémie?", "a": "Zhoubné onemocnění krvetvorné tkáně – nekontrolované množení leukocytů."}], "Oběhová soustava": [{"q": "Co je srdce?", "a": "Dutý svalový orgán čerpající krev do cévního systému."}, {"q": "Co je myokard?", "a": "Srdeční sval tvořící stěnu srdce."}, {"q": "Co jsou srdeční síně a komory?", "a": "Síně (2) přijímají krev ze žil, komory (2) vypuzují krev do tepen."}, {"q": "Co jsou chlopně?", "a": "Jednosměrné ventily v srdci zabraňující zpětnému toku krve."}, {"q": "Co je aorta?", "a": "Největší tepna těla vycházející z levé komory a rozvádějící okysličenou krev do celého těla."}, {"q": "Co je plicnice?", "a": "Tepna vedoucí odkysličenou krev z pravé komory do plic."}, {"q": "Co je systola?", "a": "Fáze stahu srdce – komory vypuzují krev do tepen."}, {"q": "Co je diastola?", "a": "Fáze uvolnění srdce – srdce se plní krví."}, {"q": "Co jsou koronární tepny?", "a": "Cévy zásobující srdeční sval kyslíkem a živinami."}, {"q": "Co je malý oběh?", "a": "Plicní oběh – krev proudí z pravé komory přes plíce (kde se okysličí) do levé síně."}, {"q": "Co je velký oběh?", "a": "Tělní oběh – krev proudí z levé komory přes celé tělo zpět do pravé síně."}, {"q": "Co jsou horní a dolní dutá žíla?", "a": "Největší žíly přivádějící odkysličenou krev z těla do pravé síně."}, {"q": "Co je EKG?", "a": "Elektrokardiogram – záznam elektrické aktivity srdce zachycující srdeční akci."}], "Trávicí soustava": [{"q": "Co je trávicí soustava?", "a": "Soustava orgánů zajišťující příjem, zpracování a vstřebávání potravy a vylučování nestravitelných zbytků."}, {"q": "Co je trávicí trubice?", "a": "Průběžný kanál od úst po konečník, v němž probíhá trávení."}, {"q": "Co je dutina ústní?", "a": "Vstupní část trávicí soustavy, kde potrava je mechanicky zpracována zuby a smíchána se slinami."}, {"q": "Co je jazyk?", "a": "Svalový orgán v ústní dutině zajišťující přijímání potravy, žvýkání, polykání a řeč."}, {"q": "Co je zub?", "a": "Tvrdý útvar v ústní dutině sloužící k mechanickému zpracování potravy."}, {"q": "Jaká je stavba zubu?", "a": "Koruna (nad dásní), krček (u dásně) a kořen (v čelisti) – tvořen sklovinou, dentinem a dřeňovou dutinou."}, {"q": "Jaké jsou typy zubů?", "a": "Řezáky (incisivi), špičáky (canini), třenové zuby (premoláry) a stoličky (moláry)."}, {"q": "Co je žaludek?", "a": "Vakovitý orgán kde se potrava mísí s žaludeční šťávou (kyselinou chlorovodíkovou a enzymy) a dochází k chemickému trávení."}, {"q": "Co je tenké střevo?", "a": "Nejdelší část trávicí trubice (6–7 m), kde probíhá většina trávení a vstřebávání živin."}, {"q": "Co je tlusté střevo?", "a": "Část trávicí trubice navazující na tenké střevo, kde se vstřebává voda a formují výkaly."}, {"q": "Co jsou játra?", "a": "Největší žláza těla – produkuje žluč, detoxikuje krev, metabolizuje živiny a ukládá glykogen."}, {"q": "Jaké trávicí enzymy znáš?", "a": "Amyláza (štěpí škrob), pepsin a trypsin (štěpí bílkoviny), lipáza (štěpí tuky)."}, {"q": "Co jsou peristaltické pohyby?", "a": "Vlnivé stahy svaloviny trávicí trubice posunující obsah směrem k konečníku."}, {"q": "Co je vstřebávání (resorpce)?", "a": "Přechod natrávených živin ze střeva do krve a lymfy."}, {"q": "Co je dvanáctník?", "a": "První část tenkého střeva, kde ústí vývody slinivky a žlučovodu."}, {"q": "Co je slinivka břišní (pankreas)?", "a": "Žláza produkující trávicí enzymy (do střeva) a hormony inzulin a glukagon (do krve)."}], "Vylučovací soustava": [{"q": "Co je vylučovací (močová) soustava?", "a": "Soustava orgánů odstraňující z těla odpadní látky metabolismu (především močovinu) formou moči."}, {"q": "Co jsou ledviny?", "a": "Párový orgán filtrující krev a produkující moč."}, {"q": "Co je nefron?", "a": "Základní funkční jednotka ledviny – filtruje krev a tvoří moč."}, {"q": "Co je antidiuretický hormon (ADH)?", "a": "Hormon hypofýzy regulující vstřebávání vody v ledvinách (snižuje tvorbu moči)."}, {"q": "Co je močovod?", "a": "Trubice odvádějící moč z ledviny do močového měchýře."}, {"q": "Co je močový měchýř?", "a": "Váčkovitý orgán shromažďující moč před vyloučením."}, {"q": "Co je močová trubice?", "a": "Kanál odvádějící moč z močového měchýře ven z těla."}, {"q": "Co je erytropoetin?", "a": "Hormon produkovaný ledvinami stimulující tvorbu červených krvinek."}, {"q": "Co jsou ledvinové kameny (konkrementy)?", "a": "Tuhé krystaly vzniklé z minerálů v moči, způsobují silné bolesti při pohybu do močovodu."}], "Smyslová soustava": [{"q": "Co je receptor?", "a": "Smyslová buňka nebo orgán přijímající podněty z prostředí a převádějící je na nervové impulsy."}, {"q": "Co je oko a jaká je jeho stavba?", "a": "Zrakový orgán složený z bělima, rohovky, duhovky, čočky, sklivce a sítnice."}, {"q": "Co je sítnice?", "a": "Vnitřní vrstva oka obsahující fotoreceptory – tyčinky (vnímají světlo) a čípky (vnímají barvy)."}, {"q": "Co je zrakový nerv?", "a": "Nerv přenášející zrakové impulsy ze sítnice do mozku."}, {"q": "Co je binokulární vidění?", "a": "Vidění oběma očima zároveň umožňující prostorové vnímání."}, {"q": "Co jsou okohybné svaly?", "a": "Svaly umožňující pohyb oční bulvy ve všech směrech."}, {"q": "Co je ucho a jaká je jeho stavba?", "a": "Sluchový orgán složený z vnějšího ucha (boltec, zevní zvukovod), středního ucha (bubínek, sluchůvky) a vnitřního ucha (hlemýžď, rovnovážný aparát)."}, {"q": "Co je perilymfa a endolymfa?", "a": "Tekutiny ve vnitřním uchu přenášející zvukové vibrace – perilymfa je vně membranózního labyrintu, endolymfa uvnitř."}, {"q": "Co je sluchový a rovnovážný nerv?", "a": "Nerv (VIII. hlavový) přenášející sluchové a rovnovážné impulsy z vnitřního ucha do mozku."}, {"q": "Co je statokinetické ústrojí?", "a": "Část vnitřního ucha (polokruhovité kanálky, váček a přísíňek) vnímající polohu a pohyb hlavy."}, {"q": "Co je hlemýžď?", "a": "Spirálně stočená část vnitřního ucha obsahující Cortiho orgán zodpovědný za sluch."}, {"q": "Jaká je stavba kůže?", "a": "Pokožka (epidermis), škára (dermis) a podkožní vazivo, obsahuje vlasové folikuly, mazové a potní žlázy."}, {"q": "Co jsou chuťové pohárky?", "a": "Smyslové buňky na jazyku vnímající čtyři základní chutě: sladkou, kyselou, slanou a hořkou."}], "Pohlavní rozmnožování a vývin": [{"q": "Co je pohlavní rozmnožování?", "a": "Způsob rozmnožování zahrnující splynutí pohlavních buněk (gamet) z dvou rodičů."}, {"q": "Co je pohlavní buňka (gameta)?", "a": "Specializovaná buňka s polovičním počtem chromozomů – spermie nebo vajíčko."}, {"q": "Co je spermie?", "a": "Mužská pohlavní buňka s bičíkem umožňujícím pohyb, přenáší genetickou informaci otce."}, {"q": "Co je vajíčko (oocyt)?", "a": "Ženská pohlavní buňka obsahující zásoby živin pro počáteční vývoj zárodku."}, {"q": "Co je folikul?", "a": "Váček ve vaječníku obklopující vyvíjející se vajíčko a produkující estrogeny."}, {"q": "Co je oplození (fertilizace)?", "a": "Splynutí spermie s vajíčkem za vzniku zygoty."}, {"q": "Co je zygota?", "a": "Oplozené vajíčko s plným počtem chromozomů, výchozí buňka nového jedince."}, {"q": "Co je zárodek (embryo)?", "a": "Vyvíjející se jedinec v počátečním stadiu po oplození až do ukončení organogeneze."}, {"q": "Co je meióza?", "a": "Buněčné dělení redukující počet chromozomů na polovinu – vznik pohlavních buněk."}, {"q": "Co jsou pohlavní chromozomy (gonozomy)?", "a": "Chromozomy určující pohlaví – u člověka XX (žena) nebo XY (muž)."}, {"q": "Co je pyj (penis)?", "a": "Mužský pohlavní orgán sloužící k přenosu spermií do ženského pohlavního ústrojí a k odvodu moči."}, {"q": "Co jsou vaječníky (ovaria)?", "a": "Ženské pohlavní žlázy produkující vajíčka a pohlavní hormony (estrogen, progesteron)."}, {"q": "Co je děloha?", "a": "Dutý svalový orgán, v němž se vyvíjí zárodek a plod."}, {"q": "Co je ovulace?", "a": "Uvolnění zralého vajíčka z folikulu vaječníku do vejcovodu."}, {"q": "Co je menstruační cyklus?", "a": "Přibližně 28denní cyklus příprav ženského těla na oplození a těhotenství."}, {"q": "Co je placenta?", "a": "Orgán zprostředkující výměnu látek (kyslíku, živin, odpadních látek) mezi matkou a plodem."}, {"q": "Co je pupečník?", "a": "Provazec cév spojující plod s placentou."}], "Endokrinní soustava": [{"q": "Co je žláza s vnitřní sekrecí (endokrinní žláza)?", "a": "Žláza vylučující hormony přímo do krve."}, {"q": "Co je endokrinní soustava?", "a": "Soustava žláz s vnitřní sekrecí koordinující funkce organismu pomocí hormonů."}, {"q": "Co je hormon?", "a": "Chemický posel produkovaný endokrinní žlázou, přenášený krví a ovlivňující cílové orgány."}, {"q": "Co je hypotalamo-hypofyzární systém?", "a": "Nadřazené centrum regulace endokrinních žláz – hypotalamus řídí hypofýzu, která řídí ostatní žlázy."}, {"q": "Co je hypofýza (podvěsek mozkový)?", "a": "Malá žláza pod mozkem řídící většinu ostatních endokrinních žláz a produkující řadu hormonů."}, {"q": "Co je přední lalok hypofýzy (adenohypofýza)?", "a": "Část hypofýzy produkující tropní hormony řídící štítnou žlázu, nadledviny, pohlavní žlázy a růstový hormon."}, {"q": "Co je růstový hormon (somatotropin)?", "a": "Hormon adenohypofýzy stimulující růst kostí a svalů."}, {"q": "Co je folikuly stimulující hormon (folitropin)?", "a": "Hormon hypofýzy stimulující zrání folikulů ve vaječnících nebo tvorbu spermií."}, {"q": "Co je neurohypofýza?", "a": "Zadní lalok hypofýzy uvolňující hormony hypotalamu: ADH a oxytocin."}, {"q": "Co je antidiuretický hormon (vazopresin)?", "a": "Hormon neurohypofýzy snižující tvorbu moči a zvyšující krevní tlak."}, {"q": "Co je oxytocin?", "a": "Hormon neurohypofýzy vyvolávající stahy dělohy při porodu a podporující tvorbu mléka."}, {"q": "Co je štítná žláza?", "a": "Žláza na krku produkující tyroxin (reguluje metabolismus) a kalcitonin (snižuje hladinu vápníku v krvi)."}, {"q": "Co je tyroxin (T4)?", "a": "Hormon štítné žlázy obsahující jód, reguluje intenzitu metabolismu a růst."}, {"q": "Co jsou nadledviny?", "a": "Párové žlázy nad ledvinami – kůra produkuje kortizol a aldosteron, dřeň produkuje adrenalin."}, {"q": "Co je slinivka břišní v roli endokrinní žlázy?", "a": "Langerhansovy ostrůvky slinivky produkují inzulin (snižuje glykemii) a glukagon (zvyšuje glykemii)."}], "Nervová soustava": [{"q": "Co je nervová soustava?", "a": "Soustava přijímající, zpracovávající a přenášející informace a koordinující činnost organismu."}, {"q": "Co je centrální nervový systém (CNS)?", "a": "Mozek a mícha – zpracovávají informace a vydávají příkazy."}, {"q": "Co je periferní nervový systém?", "a": "Nervy a ganglia spojující CNS s ostatními orgány těla."}, {"q": "Co je mozek?", "a": "Nejvyšší centrum nervové soustavy uložené v lebce, řídí veškeré funkce organismu."}, {"q": "Co je mícha?", "a": "Část CNS uložená v páteřním kanálu, přenáší impulsy mezi mozkem a tělem a řídí reflexy."}, {"q": "Co je neuron (nervová buňka)?", "a": "Základní stavební a funkční jednotka nervové soustavy schopná přijímat a přenášet nervové impulsy."}, {"q": "Co je dendrit?", "a": "Výběžek neuronu přijímající nervové impulsy od jiných neuronů."}, {"q": "Co je axon (neurit)?", "a": "Dlouhý výběžek neuronu přenášející nervový impuls od těla neuronu k dalším buňkám."}, {"q": "Co je synapse?", "a": "Funkční spojení mezi dvěma neurony nebo neuronem a svalem, přes které se přenáší nervový signál."}, {"q": "Co je neurotransmiter?", "a": "Chemická látka uvolňovaná na synapse přenášející nervový signál (acetylcholin, dopamin, serotonin)."}, {"q": "Co je reflex?", "a": "Automatická, neuvědomělá odpověď organismu na podnět."}, {"q": "Co je reflexní oblouk?", "a": "Dráha nervového vzruchu: receptor → dostředivý nerv → CNS → odstředivý nerv → efektor."}, {"q": "Co je autonomní (vegetativní) nervový systém?", "a": "Část nervové soustavy řídící mimovolní funkce (srdeční tep, trávení, dýchání)."}, {"q": "Co je sympatikus?", "a": "Část vegetativního nervstva aktivující organismus v zátěžových situacích (zrychluje tep, rozšiřuje zornice)."}, {"q": "Co je parasympatikus?", "a": "Část vegetativního nervstva podporující klidové funkce organismu (zpomaluje tep, podporuje trávení)."}, {"q": "Co je akční potenciál?", "a": "Elektrický impulz šířící se po membráně neuronu – základ nervového vzruchu."}], "Genetika": [{"q": "Co je genetika?", "a": "Věda zkoumající dědičnost a proměnlivost organismů."}, {"q": "Co je gen?", "a": "Úsek DNA nesoucí informaci pro tvorbu jednoho proteinu nebo RNA."}, {"q": "Co je alela?", "a": "Jedna z alternativních forem genu na daném lokusu chromozomu."}, {"q": "Co je homozygot?", "a": "Organismus mající na obou homologních chromozomech stejné alely daného genu."}, {"q": "Co je heterozygot?", "a": "Organismus mající na homologních chromozomech různé alely daného genu."}, {"q": "Co je genotyp?", "a": "Soubor všech genů organismu (genetická výbava)."}, {"q": "Co je fenotyp?", "a": "Soubor pozorovatelných vlastností organismu vzniklý projevem genotypu v daném prostředí."}, {"q": "Co je chromozom?", "a": "Struktura v jádře buňky tvořená DNA a proteiny nesoucí genetickou informaci."}, {"q": "Co je autosom?", "a": "Nepohlavní chromozom – člověk má 22 párů autozomů."}, {"q": "Co jsou gonozomy (pohlavní chromozomy)?", "a": "Chromozomy určující pohlaví – u člověka XX (žena) nebo XY (muž)."}, {"q": "Co je mitóza?", "a": "Buněčné dělení při němž vznikají dvě dceřiné buňky se stejným počtem chromozomů jako mateřská buňka."}, {"q": "Co je meióza?", "a": "Redukční dělení snižující počet chromozomů na polovinu – vznik pohlavních buněk."}, {"q": "Co je dědičnost?", "a": "Přenos genetické informace z rodičů na potomky."}, {"q": "Co je mutace?", "a": "Náhlá trvalá změna v sekvenci DNA způsobující změnu genotypu."}, {"q": "Co je křížení?", "a": "Záměrné nebo přirozené pohlavní rozmnožování jedinců s různými genotypy za účelem studia dědičnosti."}], "Ekologie": [{"q": "Co je ekologie?", "a": "Věda zkoumající vztahy mezi organismy a jejich prostředím."}, {"q": "Co je ekosystém?", "a": "Funkční celek tvořený společenstvem organismů (biocenózou) a jejich neživým prostředím (biotopem)."}, {"q": "Co je biotop?", "a": "Neživé prostředí, v němž žije biocenóza (vodní tok, les, louka)."}, {"q": "Co je biocenóza?", "a": "Společenstvo všech organismů žijících na daném biotopu."}, {"q": "Co je biosféra?", "a": "Část Země obývaná živými organismy – zahrnuje části litosféry, hydrosféry a atmosféry."}, {"q": "Co je biom?", "a": "Rozsáhlé společenstvo rostlin a živočichů podmíněné podnebím (tundra, step, deštný prales)."}, {"q": "Co je populace?", "a": "Soubor jedinců téhož druhu žijících ve stejném místě ve stejném čase."}, {"q": "Co je druh?", "a": "Skupina organismů schopných vzájemného křížení a produkce plodného potomstva."}, {"q": "Co je habitat?", "a": "Místo výskytu organismu s podmínkami nutnými pro jeho přežití."}, {"q": "Co je ekologická nika?", "a": "Funkční role organismu v ekosystému – souhrn jeho nároků a vztahů k prostředí."}, {"q": "Co jsou abiotické faktory?", "a": "Neživé složky prostředí (teplota, světlo, vlhkost, pH, substrát)."}, {"q": "Co jsou biotické faktory?", "a": "Vlivy ostatních organismů na daný organismus (konkurence, predace, parazitismus)."}, {"q": "Co je producent?", "a": "Autotrofní organismus vytvářející organické látky fotosyntézou nebo chemosyntézou (rostliny, řasy)."}, {"q": "Co je konzument?", "a": "Heterotrofní organismus živící se organickými látkami jiných organismů."}, {"q": "Co je rozkladač (dekompozitor)?", "a": "Organismus rozkládající mrtvou organickou hmotu na anorganické látky (houby, bakterie)."}, {"q": "Co je potravní řetězec?", "a": "Posloupnost organismů, v níž každý slouží jako potrava pro dalšího (producent → konzument → predátor)."}, {"q": "Co je ekologická pyramida?", "a": "Grafické znázornění počtu jedinců, biomasy nebo energie na jednotlivých trofických úrovních."}, {"q": "Co je trofická úroveň?", "a": "Postavení organismu v potravní síti podle způsobu získávání energie."}, {"q": "Co je biomasa?", "a": "Celková hmotnost živé organické hmoty na určitém území."}, {"q": "Co je energetický tok?", "a": "Přenos energie potravními řetězci – na každé trofické úrovni se ztrácí přibližně 90 % energie."}, {"q": "Co je koloběh látek?", "a": "Cirkulace chemických prvků (uhlíku, dusíku, fosforu) mezi živými organismy a neživým prostředím."}, {"q": "Co je fotosyntéza?", "a": "Proces, při němž zelené rostliny přeměňují světelnou energii, CO₂ a vodu na organické látky a kyslík."}, {"q": "Co je respirace (buněčné dýchání)?", "a": "Oxidativní rozklad organických látek v buňkách za uvolnění energie ve formě ATP."}, {"q": "Co je eutrofizace?", "a": "Nadměrné obohacení vody živinami (dusíkem, fosforem) způsobující přemnožení sinic a řas."}, {"q": "Co je sukcese?", "a": "Postupná přirozená změna druhového složení ekosystému v čase."}, {"q": "Co je klimax?", "a": "Vrcholné, relativně stabilní stadium sukcese přizpůsobené místním podmínkám."}, {"q": "Co je ekologická stabilita?", "a": "Schopnost ekosystému odolávat narušením a obnovovat se po nich."}, {"q": "Co je ekologická rovnováha?", "a": "Dynamická rovnováha mezi organismy a prostředím zajišťující dlouhodobé fungování ekosystému."}, {"q": "Co je disturbance?", "a": "Náhlé narušení ekosystému (požár, povodeň, vichřice) měnící jeho strukturu."}, {"q": "Co je fragmentace prostředí?", "a": "Dělení původně souvislých biotopů na izolované ostrůvky (např. výstavbou silnic)."}, {"q": "Co je populační hustota?", "a": "Počet jedinců populace na jednotku plochy nebo objemu."}, {"q": "Co je natalita?", "a": "Porodnost – počet narozených jedinců za určitou dobu."}, {"q": "Co je mortalita?", "a": "Úmrtnost – počet zemřelých jedinců za určitou dobu."}, {"q": "Co je migrace?", "a": "Přesun jedinců z jedné oblasti do druhé."}, {"q": "Co je nosná kapacita prostředí?", "a": "Maximální velikost populace, kterou je dané prostředí schopno dlouhodobě uživit."}, {"q": "Co je limitační faktor?", "a": "Faktor prostředí omezující růst populace nebo rozšíření organismu."}, {"q": "Co je ekologická tolerance?", "a": "Rozsah hodnot faktoru prostředí, které organismus snese."}, {"q": "Co je bioindikátor?", "a": "Organismus jehož výskyt nebo absence ukazuje na kvalitu prostředí (lišejníky → čistota vzduchu)."}, {"q": "Co je adaptace?", "a": "Přizpůsobení organismu podmínkám prostředí vzniklé evolucí."}, {"q": "Co je mutualismus?", "a": "Oboustranně prospěšné soužití dvou druhů (mycorrhiza, lišejník)."}, {"q": "Co je parazitismus?", "a": "Soužití, kdy parazit žije na úkor hostitele a poškozuje ho."}, {"q": "Co je komenzalismus?", "a": "Soužití, kdy jeden organismus profituje a druhý není poškozen ani prospěch."}, {"q": "Co je predace?", "a": "Mezidruhový vztah, kdy predátor loví a usmrcuje kořist jako zdroj potravy."}, {"q": "Co je konkurence?", "a": "Soutěž dvou nebo více druhů (nebo jedinců) o stejný zdroj (potravu, prostor)."}, {"q": "Co je amensalismus?", "a": "Soužití, kdy jeden organismus poškozuje druhého, aniž sám profituje (alelopatie)."}, {"q": "Co je neutralismus?", "a": "Soužití dvou druhů, při němž žádný z nich druhého neovlivňuje."}, {"q": "Co je invazní druh?", "a": "Nepůvodní druh, který se šíří v novém prostředí a vytlačuje původní druhy."}, {"q": "Co je trvale udržitelný rozvoj?", "a": "Rozvoj uspokojující potřeby současnosti, aniž ohrožuje možnosti budoucích generací."}, {"q": "Co je ochrana přírody?", "a": "Soubor opatření chránících přírodní prostředí, druhy a ekosystémy před poškozením."}, {"q": "Co je biodiverzita?", "a": "Rozmanitost živých organismů na Zemi – zahrnuje genetickou, druhovou a ekosystémovou rozmanitost."}]};

  function setMode(m) {
    mode = m;
    document.getElementById('mbP').classList.toggle('active', m==='p');
    document.getElementById('mbO').classList.toggle('active', m==='o');

  function getSections() {
    return Array.from(document.querySelectorAll('.cc')).filter(c=>c.checked).map(c=>c.value);
  }
  function setAll(v) { document.querySelectorAll('.cc').forEach(c=>c.checked=v); }

  function validate() {
    const cls=document.getElementById('cls').value;
    const qc=parseInt(document.getElementById('qc').value)||0;
    const secs=getSections();
    if (!cls) { showWarn('Vyber třídu.'); return null; }
    if (!secs.length) { showWarn('Vyber alespoň jeden okruh.'); return null; }
    if (qc<1) { showWarn('Zadej počet otázek.'); return null; }
    hideWarn();
    const pin=parseInt(document.getElementById('pin').value)||1234;
    return {cls, sc:parseInt(document.getElementById('sc').value)||2, td:document.getElementById('td').value, qc, secs, pin};
  }

  function showWarn(m) { document.getElementById('warnBox').textContent=m; document.getElementById('warnBox').style.display=''; }
  function hideWarn() { document.getElementById('warnBox').style.display='none'; }

  function shuffle(arr) {
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  }
  function genTest(qc, secs) {
    const tot=secs.reduce((s,sec)=>s+(questionsDatabase[sec]?.length||0),0);
    let sel=[];
    secs.forEach(sec=>{
      const pool=shuffle([...questionsDatabase[sec]]);
      const cnt=Math.round(qc*pool.length/tot);
      pool.slice(0,Math.min(cnt,pool.length)).forEach(q=>sel.push({...q,section:sec}));
    });
    sel=sel.slice(0,qc);
    shuffle(sel);
    return sel;
  }

  function dlFile(content, name, type) {
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function genPrint() {
    const p=validate(); if(!p) return;
    const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const sn=p.secs.join(', ');
    let c=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>

</style></head><body>`;
    for(let i=0;i<p.sc;i++) {
      if(i>0) c+='<br clear=all style="page-break-before:always">';
      const qs=genTest(p.qc,p.secs);
      c+=`<h1>TEST — BIOLOGIE — 3. ROČNÍK</h1>
<div class="hd">
  <p><strong>Jméno a příjmení:</strong> ___________________________</p>
  <p><strong>Třída:</strong> ${p.cls} &nbsp; <strong>Datum:</strong> ${p.td} &nbsp; <strong>Varianta:</strong> ${L[i]||i+1}</p>
  <p style="font-size:8pt;color:#555"><strong>Okruhy:</strong> ${sn.length>90?sn.slice(0,90)+'…':sn}</p>
</div>`;
      qs.forEach((q,j)=>{c+=`<div class="q"><p class="qt">${j+1}. ${q.q}</p><div class="af">&nbsp;</div><p class="pts">Bodů: _____</p></div>`;});
      c+=`<div class="sum"><h2>HODNOCENÍ</h2><br><p><strong>Celkem bodů:</strong> __________ / ${p.qc}</p><br><p><strong>Známka:</strong> ________________</p></div>`;
    }
    c+='</body></html>';
    dlFile(c, `testy_biologie_3rocnik_${p.cls}_${p.td}.doc`, 'application/msword');
    document.getElementById('okTxt') && (document.getElementById('okBox').innerHTML='<strong>✅ Hotovo!</strong> ' + p.sc + ' testů pro třídu ' + p.cls);

  function genOnline() {
    const p=validate(); if(!p) return;
    const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const variants=[];
    for(let i=0;i<p.sc;i++) variants.push(genTest(p.qc,p.secs));
    const varJSON=JSON.stringify(variants);
    const varOpts=Array.from({length:p.sc},(_,i)=>`<option value="${i}">Varianta ${L[i]||i+1}</option>`).join('');

    const onlineHTML = buildOnlineHTML(p, varJSON, varOpts, L);
    dlFile(onlineHTML, `test_ONLINE_biologie_3rocnik_${p.cls}_${p.td}.html`, 'text/html');

function renderTest(){

  cv.forEach((item,i)=>{
    const d=document.createElement('div');d.className='qC';d.id='qc'+i;

  });upd();

function upd(){
  let f=0;
