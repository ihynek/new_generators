<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generátor — CHEMIE — 3. ročník</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#7c3aed,#6d28d9);padding:24px;min-height:100vh}
    .container{max-width:820px;margin:0 auto}
    .card{background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:32px;margin-bottom:24px}
    h1{font-size:24px;font-weight:700;color:#1f2937;margin-bottom:20px;text-align:center}
    h2{font-size:15px;font-weight:600;color:#374151;margin-bottom:10px}
    .info{background:#eff6ff;border-radius:8px;padding:13px 16px;margin-bottom:18px;font-size:13px;color:#374151;line-height:1.6}
    .fg{margin-bottom:13px}
    .fg label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
    input,select{width:100%;padding:9px 12px;border:2px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;background:white}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .msw{display:flex;border:2px solid #d1d5db;border-radius:10px;overflow:hidden;margin-bottom:14px}
    .mb{flex:1;padding:11px;background:white;border:none;cursor:pointer;font-size:14px;font-weight:500;color:#6b7280}
    .mb.active{background:linear-gradient(to right,#7c3aed,#6d28d9);color:white}
    .mi{background:#f9fafb;border:2px solid #e5e7eb;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#374151}
    .cbox{border:2px solid #e5e7eb;border-radius:12px;padding:15px;margin-bottom:18px}
    .chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:8px}
    .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px}
    .ci{border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 10px}
    .ci:has(.cc:checked){border-color:#7c3aed;background:#eff6ff}
    .cl{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
    .cl input{width:14px;height:14px;accent-color:#7c3aed;flex-shrink:0}
    .cn{flex:1;color:#374151;font-weight:500}
    .cb{background:#e5e7eb;color:#6b7280;font-size:11px;padding:1px 7px;border-radius:20px}
    .ci:has(.cc:checked) .cb{background:#7c3aed;color:white}
    .cbtn{padding:5px 11px;border-radius:6px;border:1.5px solid #d1d5db;background:white;cursor:pointer;font-size:12px;font-weight:600;color:#374151}
    .btn{padding:13px;border-radius:8px;font-weight:600;border:none;cursor:pointer;font-size:15px;width:100%;margin-top:7px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
    .bp{background:linear-gradient(to right,#7c3aed,#6d28d9);color:white}
    .bo{background:linear-gradient(to right,#10b981,#059669);color:white}
    .bs{background:linear-gradient(to right,#6b7280,#4b5563);color:white;margin-top:13px}
    .warn{background:#fef3c7;border:2px solid #fbbf24;border-radius:8px;padding:11px;margin-top:12px;display:none;text-align:center;font-size:13px;color:#92400e}
    .ok{background:#d1fae5;border:2px solid #10b981;border-radius:8px;padding:13px;margin:12px 0;display:none;font-size:13px;color:#065f46}
    .tip{background:#dbeafe;border-radius:8px;padding:13px;margin-top:18px;font-size:13px;color:#1e40af;line-height:1.5}
  </style>
</head>
<body>
<div class="container"><div class="card">
  <h1>⚛️ Generátor testů — CHEMIE — 3. ročník</h1>

  <div class="msw">
    <button class="mb active" id="mbP" onclick="setMode('p')">📄 Papírová verze</button>
    <button class="mb" id="mbO" onclick="setMode('o')">💻 Online verze</button>
  </div>
  <div class="mi" id="mInfo">📄 <strong>Papírová verze:</strong> Testy k tisku, studenti píší rukou.</div>

  <div class="info" id="infoBox"></div>

  <div class="fg"><label>Třída:</label>
    <select id="cls"><option value="">-- Vyber třídu --</option><option value="3.A">3.A</option>
<option value="3.B">3.B</option>
<option value="7SA">7SA</option></select>
  </div>
  <div class="row">
    <div class="fg"><label>Počet studentů / variant:</label><input type="number" id="sc" value="2" min="1" max="50"></div>

    <div class="fg"><label>Datum testu:</label><input type="date" id="td"></div>
  </div>
  <div class="row">
    <div class="fg"><label>Otázek na test:</label><input type="number" id="qc" value="20" min="1" max="60"></div>
    <div class="fg">
      <label>&#128274; PIN pro učitele (zapiš si ho!):</label>
      <input type="number" id="pin" value="1234" min="1000" max="9999" placeholder="4 číslice"
        style="font-size:20px;font-weight:700;letter-spacing:4px;color:#6366f1;border-color:#6366f1"
        oninput="document.getElementById('pinShow').textContent=this.value">
      <div style="font-size:13px;color:#6b7280;margin-top:5px">
        Učitel zadá tento PIN při hodnocení: <strong id="pinShow" style="color:#6366f1;font-size:16px">1234</strong>
      </div>
    </div>
  </div>

  <div class="cbox">
    <div class="chdr">
      <h2>📚 Tematické okruhy</h2>
      <div style="display:flex;gap:7px">
        <button class="cbtn" onclick="setAll(true)">✅ Vše</button>
        <button class="cbtn" onclick="setAll(false)">❌ Zrušit</button>
      </div>
    </div>
    <div class="cgrid">
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Karboxylové kyseliny a deriváty" checked>
          <span class="cn">Karboxylové kyseliny a deriváty</span><span class="cb">8 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Aldehydy a ketony" checked>
          <span class="cn">Aldehydy a ketony</span><span class="cb">5 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Aminy a alkaloidy" checked>
          <span class="cn">Aminy a alkaloidy</span><span class="cb">3 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Aminokyseliny a proteiny" checked>
          <span class="cn">Aminokyseliny a proteiny</span><span class="cb">14 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Enzymy" checked>
          <span class="cn">Enzymy</span><span class="cb">10 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Sacharidy - základní pojmy" checked>
          <span class="cn">Sacharidy - základní pojmy</span><span class="cb">10 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Lipidy" checked>
          <span class="cn">Lipidy</span><span class="cb">8 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Nukleové kyseliny" checked>
          <span class="cn">Nukleové kyseliny</span><span class="cb">10 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Energetický metabolismus" checked>
          <span class="cn">Energetický metabolismus</span><span class="cb">9 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Metabolismus - obecné pojmy" checked>
          <span class="cn">Metabolismus - obecné pojmy</span><span class="cb">4 ot.</span>
        </label></div>
        <div class="ci"><label class="cl">
          <input type="checkbox" class="cc" value="Polymery a další pojmy" checked>
          <span class="cn">Polymery a další pojmy</span><span class="cb">6 ot.</span>
        </label></div></div>
  </div>

  <div id="aP"><button class="btn bp" onclick="genPrint()">📄 Vygenerovat testy k tisku</button></div>
  <div id="aO" style="display:none"><button class="btn bo" onclick="genOnline()">💻 Vygenerovat online test</button></div>

  <button class="btn bs" onclick="location.href='dexin.html'">← Zpět na rozcestník</button>

  <div class="warn" id="warnBox"></div>
  <div class="ok" id="okBox"></div>
  <div class="tip" id="tipBox">💡 Vyber tematické okruhy, nastav parametry a vygeneruj.</div>
</div></div>

<script>
  const questionsDatabase = {"Karboxylové kyseliny a deriváty": [{"q": "Co je acyl?", "a": "Funkční skupina R–CO– vzniklá odtržením –OH od karboxylové kyseliny."}, {"q": "Co jsou kyseliny karboxylové?", "a": "Organické sloučeniny s karboxylovou skupinou –COOH (př. kyselina octová CH₃COOH)."}, {"q": "Co je skupina karboxylová?", "a": "Funkční skupina –COOH složená z karbonylové (C=O) a hydroxylové (–OH) skupiny."}, {"q": "Co jsou deriváty karboxylových kyselin funkční?", "a": "Sloučeniny vzniklé náhradou –OH karboxylové skupiny jinou skupinou: estery, amidy, halogenidy, anhydridy."}, {"q": "Co jsou deriváty karboxylových kyselin substituční?", "a": "Sloučeniny vzniklé náhradou vodíku v uhlovodíkovém zbytku kyseliny jinou skupinou (př. halogenkyseliny)."}, {"q": "Co jsou anhydridy karboxylových kyselin?", "a": "Sloučeniny vzniklé odštěpením vody ze dvou karboxylových skupin; obecný vzorec R–CO–O–CO–R."}, {"q": "Co jsou halogenidy karboxylových kyselin?", "a": "Deriváty kyselin, kde –OH je nahrazena halogenem (–Cl, –Br); jsou velmi reaktivní (př. acetylchlorid CH₃COCl)."}, {"q": "Co jsou amidy?", "a": "Deriváty kyselin, kde –OH je nahrazena aminoskupinou –NH₂; obecný vzorec R–CO–NH₂ (př. acetamid)."}], "Aldehydy a ketony": [{"q": "Co jsou aldehydy?", "a": "Organické sloučeniny s karbonylovou skupinou C=O na konci řetězce (–CHO); př. formaldehyd HCHO, acetaldehyd CH₃CHO."}, {"q": "Co jsou ketony?", "a": "Organické sloučeniny s karbonylovou skupinou C=O uprostřed řetězce (R–CO–R'); př. aceton (CH₃)₂CO."}, {"q": "Co je skupina karbonylová?", "a": "Funkční skupina C=O (oxoskupina) přítomná v aldehydech, ketonech, kyselin a jejich derivátech."}, {"q": "Co je Fehlingovo činidlo?", "a": "Alkalický roztok komplexu Cu²⁺ (modrý); aldehydy ho redukují na červený oxid měďný Cu₂O – důkaz aldehydů."}, {"q": "Co je Tollensovo činidlo?", "a": "Amoniakální roztok dusičnanu stříbrného; aldehydy ho redukují na kovové stříbro (argentum) – stříbrné zrcadlo."}], "Aminy a alkaloidy": [{"q": "Co je aminoskupina?", "a": "Funkční skupina –NH₂ charakteristická pro aminy a aminokyseliny."}, {"q": "Co jsou aminy?", "a": "Deriváty amoniaku (NH₃), kde jsou vodíky nahrazeny uhlovodíkovými zbytky; mají zásaditý charakter (př. methylamin CH₃NH₂)."}, {"q": "Co jsou alkaloidy?", "a": "Přírodní dusíkaté látky (aminy) s fyziologickým účinkem; př. morfin, kofein, nikotin, chinin."}], "Aminokyseliny a proteiny": [{"q": "Co jsou aminokyseliny?", "a": "Organické sloučeniny obsahující aminoskupinu (–NH₂) a karboxylovou skupinu (–COOH) na stejném uhlíku – stavební kameny bílkovin."}, {"q": "Co jsou esenciální aminokyseliny?", "a": "Aminokyseliny, které si tělo neumí samo syntetizovat a musí je přijímat potravou (8–9 pro dospělé)."}, {"q": "Co jsou bílkoviny?", "a": "Polymery aminokyselin spojených peptidovými vazbami; základní stavební a funkční makromolekuly živých organismů."}, {"q": "Co jsou proteiny?", "a": "Synonymum pro bílkoviny; makromolekuly ze stovek až tisíců aminokyselin plnící strukturní, katalytické, transportní a regulační funkce."}, {"q": "Co jsou polypeptidy?", "a": "Řetězce více než 10 aminokyselin spojených peptidovými vazbami; kratší než proteiny."}, {"q": "Co je vazba peptidová?", "a": "Kovalentní vazba (–CO–NH–) vznikající kondenzací mezi –COOH jedné aminokyseliny a –NH₂ druhé aminokyseliny."}, {"q": "Co je struktura bílkovin primární?", "a": "Pořadí aminokyselin v polypeptidovém řetězci (sekvence)."}, {"q": "Co je struktura bílkovin sekundární?", "a": "Pravidelné uspořádání polypeptidového řetězce stabilizované vodíkovými vazbami: α-helix nebo β-skládaný list."}, {"q": "Co je struktura bílkovin terciální?", "a": "Trojrozměrné stočení celého polypeptidového řetězce stabilizované disulfidickými můstky, hydrofobními interakcemi a vodíkovými vazbami."}, {"q": "Co je struktura bílkovin kvartérní?", "a": "Uspořádání více polypeptidových podjednotek (řetězců) v jeden funkční komplex (př. hemoglobin)."}, {"q": "Co je helix?", "a": "Šroubovicové uspořádání polypeptidového řetězce (α-helix) stabilizované vodíkovými vazbami."}, {"q": "Co je denaturace?", "a": "Rozrušení prostorové struktury bílkoviny (sekundární až kvartérní) fyzikálními nebo chemickými vlivy bez přerušení peptidových vazeb."}, {"q": "Co jsou glykoproteiny?", "a": "Bílkoviny s připojenými oligosacharidovými řetězci; nacházejí se na buněčných membránách a v tělních tekutinách."}, {"q": "Co je proteosyntéza?", "a": "Tvorba bílkovin v ribozomech na základě genetické informace přepisem DNA do mRNA a překladem mRNA na aminokyselinový řetězec."}], "Enzymy": [{"q": "Co jsou enzymy?", "a": "Biologické katalyzátory (bílkoviny) urychlující biochemické reakce, přičemž samy nejsou spotřebovány."}, {"q": "Co je aktivita enzymu?", "a": "Rychlost katalyzované reakce za definovaných podmínek (teplota, pH, koncentrace substrátu)."}, {"q": "Co je substrát?", "a": "Látka, na níž enzym působí a přeměňuje ji na produkt."}, {"q": "Co je apoenzym?", "a": "Proteinová (bílkovinná) část enzymu bez kofaktoru; samotná bez kofaktoru není katalyticky aktivní."}, {"q": "Co je holoenzym?", "a": "Kompletní enzymaticky aktivní forma enzymu = apoenzym + kofaktor."}, {"q": "Co jsou koenzymy?", "a": "Organické nízkomolekulární kofaktory enzymů, často odvozené od vitamínů (NAD⁺, FAD, koenzym A)."}, {"q": "Co jsou kofaktory enzymů?", "a": "Neproteinové složky nezbytné pro aktivitu enzymu – mohou být organické (koenzymy) nebo anorganické (kovy: Mg²⁺, Zn²⁺)."}, {"q": "Co je inhibice?", "a": "Snížení nebo zablokování enzymové aktivity inhibitorem (kompetitivní nebo nekompetitivní)."}, {"q": "Co je apoprotein?", "a": "Proteinová část složeného proteinu bez prostetické skupiny (synonymum apoenzymu)."}, {"q": "Co jsou skupiny prostetické?", "a": "Neproteinové složky pevně vázané na protein (na rozdíl od koenzymů se neuvolňují); př. hem v hemoglobinu."}], "Sacharidy - základní pojmy": [{"q": "Co jsou cukry?", "a": "Synonymum pro sacharidy; organické sloučeniny s obecným vzorcem Cₙ(H₂O)ₘ."}, {"q": "Co jsou sacharidy?", "a": "Nejrozšířenější organické látky; polyhydroxyaldehydy nebo polyhydroxyketony a jejich polymery; funkce energetická, zásobní a strukturní."}, {"q": "Co jsou disacharidy?", "a": "Sacharidy tvořené dvěma monosacharidovými jednotkami spojenými glykosidovou vazbou (př. sacharóza, laktóza, maltóza)."}, {"q": "Co jsou oligosacharidy?", "a": "Sacharidy tvořené 2–10 monosacharidovými jednotkami."}, {"q": "Co jsou polysacharidy?", "a": "Polymery monosacharidů (>10 jednotek); zásobní (škrob, glykogen) nebo strukturní (celulóza, chitin)."}, {"q": "Co jsou deoxycukry?", "a": "Sacharidy, v nichž je jedna –OH skupina nahrazena vodíkem (př. deoxyribóza v DNA)."}, {"q": "Co je vazba glykosidová?", "a": "Kovalentní vazba spojující monosacharidové jednotky v di- a polysacharidech (acetal)."}, {"q": "Co jsou Haworthovy vzorce?", "a": "Perspektivní (přehledné) znázornění cyklické formy sacharidů jako plochých šesti- nebo pětičlenných kruhů."}, {"q": "Co jsou Fischerovy vzorce?", "a": "Projekční vzorce zobrazující otevřenou řetězcovou formu sacharidů ve svislé poloze s C=O nahoře."}, {"q": "Co jsou Tollensovy vzorce?", "a": "Perspektivní vzorce cyklické formy sacharidů (obdobné Haworthovým) v historickém pojetí."}], "Lipidy": [{"q": "Co jsou lipidy?", "a": "Hydrofobní nebo amfipatické organické látky nerozpustné ve vodě, ale rozpustné v nepolárních rozpouštědlech; zahrnují tuky, fosfolipidy, steroidy a terpeny."}, {"q": "Co jsou kyseliny mastné?", "a": "Alifatické karboxylové kyseliny s dlouhým uhlovodíkovým řetězcem (C₁₂–C₂₄); nasycené nebo nenasycené; stavební složka tuků."}, {"q": "Co jsou tuky?", "a": "Triestry glycerolu a mastných kyselin (triacylglyceroly); zásobní lipidy v živočišných a rostlinných tkáních."}, {"q": "Co jsou triacylglyceroly?", "a": "Estery glycerolu se třemi mastnými kyselinami; hlavní forma zásobních tuků."}, {"q": "Co jsou fosfolipidy?", "a": "Lipidy s fosfátovou skupinou a dvěma mastnými kyselinami; tvoří dvojvrstvu biologických membrán (amfipatické molekuly)."}, {"q": "Co jsou steroidy?", "a": "Lipidy s charakteristickým čtyřkruhovým uhlovodíkovým skeletem (cyklopentanoperhydrofenantren); zahrnují cholesterol, steroidní hormony a vitamín D."}, {"q": "Co jsou terpeny?", "a": "Přírodní látky tvořené isoprenovými jednotkami (C₅); monoterpeny (vůně), sesqui-, di-, tetraterpeny (karoteny), polyterpeny (kaučuk)."}, {"q": "Co jsou isoprenoidy?", "a": "Synonymum pro terpeny; látky odvozené od isoprenu (2-methylbuta-1,3-dien)."}], "Nukleové kyseliny": [{"q": "Co jsou kyseliny nukleové?", "a": "Polymery nukleotidů nesoucí genetickou informaci (DNA) nebo zprostředkovávající proteosyntézu (RNA)."}, {"q": "Co je DNA?", "a": "Deoxyribonukleová kyselina – dvojšroubovicový polymer deoxyribonukleotidů nesoucí genetickou informaci."}, {"q": "Co je RNA?", "a": "Ribonukleová kyselina – jednovláknový polymer ribonukleotidů; přenáší a realizuje genetickou informaci."}, {"q": "Co jsou báze nukleových kyselin?", "a": "Dusíkaté báze tvořící nukleotidy: puriny (adenin A, guanin G) a pyrimidiny (cytosin C, thymin T v DNA / uracil U v RNA)."}, {"q": "Co je komplementarita bází?", "a": "Specifické párování bází vodíkovými vazbami: A–T (DNA) nebo A–U (RNA) a G–C."}, {"q": "Co je m-RNA?", "a": "Mediátorová RNA – přenáší genetickou informaci z DNA k ribozomům jako předloha pro proteosyntézu."}, {"q": "Co je r-RNA?", "a": "Ribozomální RNA – strukturní a katalytická složka ribozomů."}, {"q": "Co je t-RNA?", "a": "Transferová RNA – přenáší aminokyseliny k ribozomům při translaci; každá má antikodon odpovídající kodonu mRNA."}, {"q": "Co je transkripce?", "a": "Přepis genetické informace z DNA do mRNA v jádře buňky."}, {"q": "Co je translace?", "a": "Překlad sekvence kodonů mRNA na sekvenci aminokyselin (bílkovinu) v ribozomech."}], "Energetický metabolismus": [{"q": "Co je ATP?", "a": "Adenozintrifosfát – univerzální nosič chemické energie v buňce; hydrolýzou uvolňuje energii pro buněčné procesy."}, {"q": "Co je ADP?", "a": "Adenozindifosfát – vzniká hydrolýzou ATP; regeneruje se fosforylací zpět na ATP."}, {"q": "Co je Acetyl CoA?", "a": "Acetylkoenzym A – aktivovaný dvouuhlíkový fragment vstupující do Krebsova cyklu; vzniká z pyruvátu, mastných kyselin a aminokyselin."}, {"q": "Co je glykolýza?", "a": "Anaerobní rozklad glukózy (C₆) na dvě molekuly pyruvátu (C₃) v cytoplazmě s výnosem 2 ATP."}, {"q": "Co je Krebsův cyklus?", "a": "Cyklus oxidativní dekarboxylace acetyl CoA na CO₂ v mitochondriích; produkuje NADH a FADH₂ pro dýchací řetězec."}, {"q": "Co je dýchací řetězec?", "a": "Soustava enzymových komplexů ve vnitřní mitochondriální membráně přenášejících elektrony na O₂ a syntetizujících ATP (oxidativní fosforylace)."}, {"q": "Co je β-oxidace mastných kyselin?", "a": "Katabolický rozklad mastných kyselin v mitochondriích po dvouuhlíkových fragmentech za vzniku acetyl CoA a redukovaných koenzymů."}, {"q": "Co je ornitinový cyklus?", "a": "Cyklus detoxikace amoniaku v játrech přeměnou na močovinu, která se vylučuje ledvinami."}, {"q": "Co je fotosyntéza?", "a": "Proces přeměny světelné energie, CO₂ a H₂O na glukózu a kyslík v chloroplastech rostlin a sinic."}], "Metabolismus - obecné pojmy": [{"q": "Co je biochemie?", "a": "Věda studující chemické procesy probíhající v živých organismech."}, {"q": "Co je metabolismus?", "a": "Souhrn všech chemických reakcí probíhajících v organismu (katabolismus + anabolismus)."}, {"q": "Co je katabolismus?", "a": "Rozkladné metabolické procesy rozkládající složité látky na jednodušší za uvolnění energie."}, {"q": "Co je anabolismus?", "a": "Syntetické metabolické procesy budující složité látky ze jednodušších za spotřeby energie."}], "Polymery a další pojmy": [{"q": "Co jsou biopolymery?", "a": "Přírodní polymery syntetizované živými organismy: proteiny, nukleové kyseliny, polysacharidy a přírodní polyisopreny."}, {"q": "Co jsou polymery?", "a": "Makromolekuly tvořené opakujícími se monomerními jednotkami spojenými kovalentními vazbami."}, {"q": "Co je polymerace?", "a": "Reakce spojování monomerů v polymer (aditivní – bez vedlejšího produktu, nebo kondenzační – s odštěpením malé molekuly)."}, {"q": "Co jsou heterocyklické sloučeniny?", "a": "Cyklické organické sloučeniny, v jejichž kruhu je kromě uhlíku alespoň jeden jiný atom (heteroatom: N, O, S); př. pyridin, furan, purin."}, {"q": "Co jsou hormony?", "a": "Chemičtí poslové vylučovaní žlázami s vnitřní sekrecí do krve; regulují fyziologické procesy (inzulin, estrogen, adrenalin)."}, {"q": "Co jsou vitamíny?", "a": "Organické látky nezbytné v malých množstvích pro normální funkci organismu; musí být přijímány potravou; dělí se na rozpustné v tucích (A, D, E, K) a ve vodě (B, C)."}]};

  function setMode(m) {
    mode = m;
    document.getElementById('mbP').classList.toggle('active', m==='p');
    document.getElementById('mbO').classList.toggle('active', m==='o');
    document.getElementById('aP').style.display = m==='p' ? '' : 'none';
    document.getElementById('aO').style.display = m==='o' ? '' : 'none';

      ? '📄 <strong>Papírová verze:</strong> Testy k tisku, studenti píší rukou.'
      : '💻 <strong>Online verze:</strong> Student vyplní v prohlížeči → stáhne hodnotící soubor → nahraje do Google Classroom. Učitel stáhne, oboduje, nahraje zpět.';

      ? '💡 Každý student dostane jiné otázky (proporcionálně z vybraných okruhů).'
      : '💡 Po odevzdání se automaticky otevře hodnotící soubor v novém okně. Student ho uloží (Ctrl+S) a nahraje do Classroom.';

  function getSections() {
    return Array.from(document.querySelectorAll('.cc')).filter(c=>c.checked).map(c=>c.value);
  }
  function setAll(v) { document.querySelectorAll('.cc').forEach(c=>c.checked=v); }

  function validate() {
    const cls=document.getElementById('cls').value;
    const qc=parseInt(document.getElementById('qc').value)||0;
    const secs=getSections();
    if (!cls) { showWarn('Vyber třídu.'); return null; }
    if (!secs.length) { showWarn('Vyber alespoň jeden okruh.'); return null; }
    if (qc<1) { showWarn('Zadej počet otázek.'); return null; }
    hideWarn();
    const pin=parseInt(document.getElementById('pin').value)||1234;
    return {cls, sc:parseInt(document.getElementById('sc').value)||2, td:document.getElementById('td').value, qc, secs, pin};
  }

  function showWarn(m) { document.getElementById('warnBox').textContent=m; document.getElementById('warnBox').style.display=''; }
  function hideWarn() { document.getElementById('warnBox').style.display='none'; }

  function shuffle(arr) {
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  }
  function genTest(qc, secs) {
    const tot=secs.reduce((s,sec)=>s+(questionsDatabase[sec]?.length||0),0);
    let sel=[];
    secs.forEach(sec=>{
      const pool=shuffle([...questionsDatabase[sec]]);
      const cnt=Math.round(qc*pool.length/tot);
      pool.slice(0,Math.min(cnt,pool.length)).forEach(q=>sel.push({...q,section:sec}));
    });
    sel=sel.slice(0,qc);
    shuffle(sel);
    return sel;
  }

  function dlFile(content, name, type) {
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function genPrint() {
    const p=validate(); if(!p) return;
    const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const sn=p.secs.join(', ');
    let c=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@media print{.tp{page-break-after:always}.tp:last-child{page-break-after:auto}}
@media screen{.tp{border-bottom:3px solid #999;margin-bottom:30px;padding-bottom:20px}}

.hd p{margin:1.5px 0;font-size:9pt}

</style></head><body>`;
    for(let i=0;i<p.sc;i++) {
      if(i>0) c+='<br clear=all style="page-break-before:always">';
      const qs=genTest(p.qc,p.secs);
      c+=`<h1>TEST — CHEMIE — 3. ROČNÍK</h1>
<div class="hd">
  <p><strong>Jméno a příjmení:</strong> ___________________________</p>
  <p><strong>Třída:</strong> ${p.cls} &nbsp; <strong>Datum:</strong> ${p.td} &nbsp; <strong>Varianta:</strong> ${L[i]||i+1}</p>
  <p style="font-size:8pt;color:#555"><strong>Okruhy:</strong> ${sn.length>90?sn.slice(0,90)+'…':sn}</p>
</div>`;
      qs.forEach((q,j)=>{c+=`<div class="q"><p class="qt">${j+1}. ${q.q}</p><div class="af">&nbsp;</div><p class="pts">Bodů: _____</p></div>`;});
      c+=`<div class="sum"><h2>HODNOCENÍ</h2><br><p><strong>Celkem bodů:</strong> __________ / ${p.qc}</p><br><p><strong>Známka:</strong> ________________</p></div>`;
    }
    c+='</body></html>';
    dlFile(c, `testy_chemie_3rocnik_${p.cls}_${p.td}.doc`, 'application/msword');
    document.getElementById('okTxt') && (document.getElementById('okBox').innerHTML='<strong>✅ Hotovo!</strong> ' + p.sc + ' testů pro třídu ' + p.cls);
    document.getElementById('okBox').style.display='';
  }

  function genOnline() {
    const p=validate(); if(!p) return;
    const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const variants=[];
    for(let i=0;i<p.sc;i++) variants.push(genTest(p.qc,p.secs));
    const varJSON=JSON.stringify(variants);
    const varOpts=Array.from({length:p.sc},(_,i)=>`<option value="${i}">Varianta ${L[i]||i+1}</option>`).join('');

    const onlineHTML = buildOnlineHTML(p, varJSON, varOpts, L);
    dlFile(onlineHTML, `test_ONLINE_chemie_3rocnik_${p.cls}_${p.td}.html`, 'text/html');
    document.getElementById('okBox').innerHTML='<strong>✅ Online test vygenerován!</strong><br>'
      +'<small>Sdílej soubor studentům. Po vyplnění student nahraje hodnotící soubor do Classroom.</small><br>'
      +'<strong style="color:#6366f1">🔒 PIN pro hodnocení: ' + p.pin + '</strong> (zapiš si ho!)';
    document.getElementById('okBox').style.display='';
  }

const allV=${varJSON};
const mPts=${p.qc},pPQ=1;
const TB64="${TEACHER_B64}";
const PIN=${p.pin};
let cv=null,sN='',sVar='',curAns=[];

function startTest(){
  const ne=document.getElementById('sName'),ve=document.getElementById('vSel');
  sN=ne.value.trim();const vi=parseInt(ve.value);
  const err=document.getElementById('selErr');
  if(!sN){err.textContent='Zadej prosím své jméno.';err.style.display='block';ne.focus();return;}
  if(isNaN(vi)){err.textContent='Vyber variantu.';err.style.display='block';return;}
  err.style.display='none';
  cv=allV[vi];
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';sVar='Varianta '+(L[vi]||vi+1);
  document.getElementById('tMeta').textContent=sN+' | '+sVar+' | ${p.cls} | ${p.td}';
  renderTest();
  document.getElementById('scSel').style.display='none';
  document.getElementById('scTest').style.display='block';
  window.scrollTo(0,0);
}

function renderTest(){
  const b=document.getElementById('tBod');b.innerHTML='';
  cv.forEach((item,i)=>{
    const d=document.createElement('div');d.className='qC';d.id='qc'+i;
    d.innerHTML='<div class="qH"><span class="qN">Otázka '+(i+1)+' / ${p.qc}</span><span class="qS">'+item.section+'</span></div>'
      +'<div class="qT">'+item.q+'</div>'
      +'<textarea class="qTA" id="a'+i+'" placeholder="Napiš svou odpověď..." oninput="upd()"></textarea>'
      +'<div class="qF"><span class="pb">max 1 bod</span></div>';
    b.appendChild(d);
  });upd();
}

function upd(){
  let f=0;
  cv.forEach((_,i)=>{
    const e=document.getElementById('a'+i),c=document.getElementById('qc'+i);
    if(e&&e.value.trim()){f++;if(c)c.className='qC done';}else{if(c)c.className='qC';}
  });
  document.getElementById('pF').style.width=Math.round(f/cv.length*100)+'%';
}

function submitTest(){
  const ua=cv.filter((_,i)=>{const e=document.getElementById('a'+i);return!e||!e.value.trim();}).length;
  if(ua>0&&!confirm('Máš '+ua+' nezodpovězených otázek. Opravdu odevzdat?'))return;
  curAns=cv.map((item,i)=>{
    return{q:item.q,sec:item.section,sA:(document.getElementById('a'+i)||{value:''}).value.trim(),cA:item.a};
  });
  document.getElementById('dName').textContent=sN;
  document.getElementById('dVar').textContent=sVar;
  document.getElementById('scTest').style.display='none';
  document.getElementById('scDone').style.display='flex';
  window.scrollTo(0,0);
  openTeacherFile();
}
